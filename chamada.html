<script>
const PAGES = ["\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"dark\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#002233\"\u003e\n\u003cmeta name=\"robots\" content=\"noindex,nofollow\"\u003e\n\u003ctitle\u003eRoleta Interativa · Chamada · Semana de Segurança e Privacidade\u003c/title\u003e\n\u003cstyle\u003e\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 300; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Light.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 400; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Regular.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 600; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-SemiBold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 700; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Bold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 800; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-ExtraBold.ttf\u0027) format(\u0027truetype\u0027); }\n  :root {\n    /* paleta TOTVS, sempre em cor chapada (100% de opacidade) */\n    --azul-escuro: #002233; --azul: #00DBFF; --roxo: #A44DFF; --rosa: #FF009E; --verde: #00FFD4; --limao: #D9FF65; --laranja: #FF8900; --branco: #FFFFFF;\n    --fonte: \u0027TOTVS\u0027, sans-serif;     /* a tipografia TOTVS vale para tudo: títulos, subtítulos e texto corrido */\n    --u: min(1vw, 1.65vh);            /* unidade fluida: tudo se ajusta ao tamanho da tela, de notebook a TV 4K */\n  }\n  @media (max-aspect-ratio: 7/5) { :root { --u: min(1.7vw, 1.1vh); } }   /* telas \"em pé\": layout empilhado */\n  * { box-sizing: border-box; }\n  html, body { height: 100%; }\n  body {\n    margin: 0; overflow: hidden; color: var(--branco); font: 400 calc(var(--u) * 1.55)/1.4 var(--fonte);\n    user-select: none; -webkit-user-select: none;\n    /* gradiente do manual (tipo 1): azul escuro + cor adicional (roxo), nas pontas, com 100% de opacidade; só no fundo */\n    background: linear-gradient(45deg, var(--roxo) 0%, var(--azul-escuro) 65%);\n    background-attachment: fixed;\n  }\n  h1, p { margin: 0; }\n  h1 { font: 700 calc(var(--u) * 3.9)/1.05 var(--fonte); letter-spacing: -.02em; text-transform: uppercase; }\n  .hl { color: var(--verde); }      /* cor de destaque em um trecho do título (uso pontual) */\n\n  /* ---------- palco ---------- */\n  #stage { position: relative; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: center; gap: calc(var(--u) * 3);\n    padding: calc(var(--u) * 3) calc(var(--u) * 4); }\n  .wheelbox { display: grid; place-items: center; min-height: 0; min-width: 0; }\n  .wheelwrap { position: relative; width: min(100%, calc(100vh - var(--u) * 8), calc(100dvh - var(--u) * 8)); aspect-ratio: 1; }\n  .wheelwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }\n  .pointer { position: absolute; top: 0; left: 50%; width: 8%; aspect-ratio: 1; transform: translate(-50%, 2%); background: var(--limao); clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 2; }\n  #rot { transform-origin: 0 0; will-change: transform; }\n  .ss { fill: #00DBFF; } .sp { fill: #00FFD4; } .sg { fill: #A44DFF; }   /* segurança = azul, privacidade = verde, proteção total = roxo */\n  .ls { font: 700 21px var(--fonte); fill: #002233; letter-spacing: .01em; }\n  .lg { font: 800 20px var(--fonte); fill: #FFFFFF; letter-spacing: .05em; }\n\n  /* ---------- chamada: um cartão de azul escuro chapado, onde todas as cores da paleta têm bom contraste ---------- */\n  .card { --c: var(--roxo); --s: calc(var(--u) * 1.8); --t: 4px; position: relative; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 2.2) calc(var(--u) * 3.4);\n    background:\n      linear-gradient(var(--c), var(--c)) top left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) top right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top right / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--s) no-repeat,\n      var(--azul-escuro); }\n  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: calc(var(--u) * 2); }\n  .tag { font: 700 calc(var(--u) * 1.2)/1.3 var(--fonte); letter-spacing: .16em; text-transform: uppercase; color: var(--verde); }\n  .logo { flex: none; height: calc(var(--u) * 3.4); width: auto; display: block; }   /* assinatura oficial TOTVS, branca, sem efeitos */\n  .legend { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .8) calc(var(--u) * 2.4); margin-top: calc(var(--u) * 1.4); font: 700 calc(var(--u) * 1.3) var(--fonte); letter-spacing: .1em; text-transform: uppercase; color: var(--branco); }\n  .legend span { display: inline-flex; align-items: center; gap: calc(var(--u) * .8); }\n  .sw { display: inline-block; width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); border-radius: 3px; }\n  .sw.ss { background: #00DBFF; } .sw.sp { background: #00FFD4; } .sw.sg { background: #A44DFF; }\n  .call { font: 700 calc(var(--u) * 2.3)/1.2 var(--fonte); letter-spacing: -.01em; }\n  .lead { font-size: calc(var(--u) * 1.55 03e\u003c/g\u003e\u003c/g\u003e\n        \u003ccircle r=\"52\" fill=\"#002233\" stroke=\"#FFFFFF\" stroke-width=\"5\"/\u003e\n        \u003cpath d=\"M0 -26 L22 -18 V3 C22 17 12 25 0 31 C-12 25 -22 17 -22 3 V-18 Z\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linejoin=\"round\"/\u003e\n        \u003ccircle cx=\"0\" cy=\"-3\" r=\"5\" fill=\"#D9FF65\"/\u003e\n      \u003c/svg\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n  \u003csection class=\"card\"\u003e\n    \u003cdiv class=\"top\"\u003e\n      \u003cdiv class=\"tag\"\u003eSemana de Segurança e Privacidade\u003c/div\u003e\n      \u003csvg class=\"logo\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" viewBox=\"0 0 302 92\" role=\"img\" aria-label=\"TOTVS\"\u003e\n  \u003cdefs\u003e\n    \u003cstyle\u003e\n      .st0 {\n        fill: #fff;\n      }\n    \u003c/style\u003e\n  \u003c/defs\u003e\n  \u003cpath class=\"st0\" d=\"M75.8,22.7c-.4-1.6-1.4-3-2.9-4-7.5-5.6-16.4-9.8-26.1-12.4-.9-.2-1.9-.4-2.9-.4s-2,.1-2.9.4c-9.7,2.5-18.6,6.7-26.1,12.4-1.4,1.1-2.4,2.5-2.9,4-1.1,4.1-1.7,8.3-1.7,12.4v21.7c0,4.2.6,8.3,1.7,12.4.4,1.6,1.4,3,2.9,4,7.5,5.6,16.4,9.8,26.1,12.4.9.2,1.9.4,2.9.4s2-.1,2.9-.4c9.7-2.5,18.6-6.7,26.1-12.4,1.4-1.1,2.4-2.5,2.9-4,1.1-4.1,1.7-8.3,1.7-12.4v-21.7c0-4.2-.6-8.3-1.7-12.4M74.8,47.4c-.4,1.4-1.3,2.6-2.6,3.6-3.7,2.8-7.7,5.2-12.1,7.2-4.3,2-8.9,3.7-13.7,4.9-.8.2-1.7.3-2.6.3s-1.8-.1-2.6-.3c-4.8-1.2-9.4-2.9-13.7-4.9-4.3-2-8.4-4.5-12.1-7.2-1.3-1-2.2-2.2-2.6-3.6h0c-.3-.9-.3-1.9,0-2.8h0c.4-1.4,1.3-2.6,2.6-3.6,3.7-2.8,7.7-5.2,12.1-7.2,4.3-2,8.9-3.7,13.7-4.9.8-.2,1.7-.3,2.6-.3s1.8.1,2.6.3c4.8,1.2,9.4,2.9,13.7,4.9,4.3,2,8.4,4.5,12.1,7.2,1.3,1,2.2,2.2,2.6,3.6.3.9.3,1.9,0,2.8\"/\u003e\n  \u003cpath class=\"st0\" d=\"M106.5,34.4h-9.8c-1.6,0-2.5-.9-2.5-2.5v-6h34.3v6c0,1.6-.9,2.5-2.5,2.5h-9.8v31.7h-9.7v-31.7Z\"/\u003e\n  \u003cpath class=\"st0\" d=\"M153.6,57.4c2.4-1,4.1-2.2,6.1-3.8,1.5-1.2,2.3-2.7,2.4-4.5.3-2.5.3-3.6,0-6.1-.2-1.7-1-3.3-2.4-4.5-2-1.6-3.7-2.8-6.1-3.9-.7-.3-1.6-.5-2.6-.5s-1.8.2-2.6.5c-2.4,1-4.1,2.2-6.1,3.9-1.5,1.1-2.3,2.8-2.4,4.5-.3,2.5-.3,3.6,0,6.1.2,1.8.9,3.3,2.4,4.5,2,1.6,3.7,2.8,6.1,3.8.8.3,1.6.4,2.6.4s1.8-.1,2.6-.4M144.7,66c-2.8-1.1-6.2-2.8-8.6-4.6-3.5-2.6-5.7-6.6-6.2-10.9-.3-3.1-.3-5.8,0-8.9.5-4.3,2.7-8.3,6.2-10.9,2.4-1.9,5.7-3.6,8.6-4.7,2-.8,4.1-1.3,6.3-1.3s4.4.6,6.3,1.3c2.9,1.1,6.2,2.8,8.6,4.7,3.5,2.5,5.7,6.6,6.2,10.9.3,3.1.3,5.8,0,8.9-.5,4.3-2.7,8.3-6.2,10.9-2.4,1.8-5.7,3.5-8.6,4.6-2,.8-4.1,1.4-6.3,1.4s-4.3-.6-6.3-1.4\"/\u003e\n  \u003cpath class=\"st0\" d=\"M185.8,34.4h-9.8c-1.6,0-2.5-.9-2.5-2.5v-6h34.3v6c0,1.6-.9,2.5-2.5,2.5h-9.8v31.7h-9.7v-31.7Z\"/\u003e\n  \u003cpath class=\"st0\" d=\"M226.6,64.6l-10.7-13.8c-.8-1-1-1.8-1-3v-21.9h7c1.6,0,2.5.9,2.5,2.5v17.5c0,1.2.3,2.1,1,3.1l7.1,8.8,6.8-8.8c.7-1,1-1.9,1-3.1v-17.5c0-1.6.9-2.5,2.5-2.5h7v21.9c0,1.2-.3,2.1-1,3.1l-10.5,13.7c-.8,1-1.7,1.5-3,1.5h-5.7c-1.3,0-2.2-.4-3-1.5\"/\u003e\n  \u003cpath class=\"st0\" d=\"M256.1,53.1h7.5c1.7,0,2,.6,2.5,2.2.7,2.4,2.7,3.6,6.9,3.6h2.2c4.3,0,6.5-1.3,6.5-4v-.9c0-1.6-1.4-2.7-4.2-3.2l-9.4-1.7c-6.7-1.2-11.3-4.4-11.3-10.3v-2.3c0-7.4,6.6-11.6,14.5-11.6h4.5c9.5,0,14.8,5,14.8,13h-7.6c-1.5,0-1.9-.4-2.2-1.6-.6-2.2-2.2-3.3-5.5-3.3h-2.6c-3,0-6,.8-6,3.6v.9c0,1.4,1.3,2.5,3.9,2.9l9.9,1.8c6.6,1.2,11.1,4.2,11.1,10.4v2.4c0,8-7.1,12-15.6,12h-4.1c-9.3,0-15.9-4.2-15.9-13.9\"/\u003e\n\u003c/svg\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003ch1\u003eRoleta \u003cspan class=\"hl\"\u003eInterativa\u003c/span\u003e\u003c/h1\u003e\n      \u003cdiv class=\"legend\" aria-hidden=\"true\"\u003e\u003cspan\u003e\u003ci class=\"sw ss\"\u003e\u003c/i\u003eSegurança\u003c/span\u003e\u003cspan\u003e\u003ci class=\"sw sp\"\u003e\u003c/i\u003ePrivacidade\u003c/span\u003e\u003cspan\u003e\u003ci class=\"sw sg\"\u003e\u003c/i\u003eProteção Total\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cp class=\"call\"\u003eAceita o desafio de proteger a TOTVS?\u003c/p\u003e\n    \u003cp class=\"lead\"\u003eGire a roda, enfrente uma situação de segurança ou de privacidade e \u003cb\u003eacerte o quiz para levar um brinde\u003c/b\u003e. Caiu em Proteção Total? Passe no desafio e leve um prêmio!\u003c/p\u003e\n    \u003cdiv class=\"when-block\"\u003e\u003cdiv class=\"tag live\"\u003eTerça-feira - 24/11\u003c/div\u003e\u003cdiv class=\"when\"\u003e10h às 16h\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"when-block\"\u003e\u003cdiv class=\"tag\"\u003eOnde\u003c/div\u003e\u003cdiv class=\"where\"\u003eCorredor do 1º andar\u003c/div\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n/* Mesma roda do jogo (roleta.html), só para exibir: gira sozinha, sem toque e sem registro de dados. */\nconst $ = id =\u003e document.getElementById(id);\nconst SLICES = [   // mesma ordem da roleta: segurança e privacidade alternadas, com 2 fatias de Proteção Total\n  { gold: true, label: \u0027PROTEÇÃO TOTAL\u0027 }, { kind: \u0027s\u0027, label: \u0027Caiu no phishing\u0027 }, { kind: \u0027p\u0027, label: \u0027Dados na IA\u0027 }, { kind: \u0027s\u0027, label: \u0027Senha vazada\u0027 },\n  { kind: \u0027p\u0027, label: \u0027Destino errado\u0027 }, { kind: \u0027s\u0027, label: \u0027Ransomware\u0027 }, { gold: true, label: \u0027PROTEÇÃO TOTAL\u0027 }, { kind: \u0027p\u0027, label: \u0027Selfie reveladora\u0027 },\n  { kind: \u0027s\u0027, label: \u0027Wi-Fi falso\u0027 }, { kind: \u0027p\u0027, label: \u0027Dados demais\u0027 }, { kind: \u0027s\u0027, label: \u0027Pendrive-isca\u0027 }, { kind: \u0027p\u0027, label: \u0027Base aberta\u0027 },\n];\nconst esc = s =\u003e String(s).replace(/[\u0026\u003c\u003e\"\u0027]/g, c =\u003e ({ \u0027\u0026\u0027: \u0027\u0026amp;\u0027, \u0027\u003c\u0027: \u0027\u0026lt;\u0027, \u0027\u003e\u0027: \u0027\u0026gt;\u0027, \u0027\"\u0027: \u0027\u0026quot;\u0027, \"\u0027\": \u0027\u0026#39;\u0027 }[c]));\nconst R = 290;\nconst pt = (deg, r) =\u003e { const a = deg * Math.PI / 180; return [(r * Math.sin(a)).toFixed(2), (-r * Math.cos(a)).toFixed(2)]; };\nconst reduceMotion = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n\n$(\u0027slices\u0027).innerHTML = SLICES.map((s, i) =\u003e {\n  const c = i * 30, [x1, y1] = pt(c - 15, R), [x2, y2] = pt(c + 15, R);\n  const cls = s.gold ? \u0027sg\u0027 : (s.kind === \u0027p\u0027 ? \u0027sp\u0027 : \u0027ss\u0027);\n  return `\u003cg\u003e\u003cpath class=\"${cls}\" d=\"M0 0 L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z\" stroke=\"#002233\" stroke-width=\"3\"/\u003e\n    \u003ctext class=\"${s.gold ? \u0027lg\u0027 : \u0027ls\u0027}\" transform=\"rotate(${c - 90}) translate(${R - 20},0)\" text-anchor=\"end\" dominant-baseline=\"central\"\u003e${esc(s.label)}\u003c/text\u003e\u003c/g\u003e`;\n}).join(\u0027\u0027);\n\n/* Gira devagar o tempo todo e, de tempos em tempos, dá um giro completo que desacelera como no jogo. */\nlet rot = 0, raf = 0;\nconst setRot = (deg, ms) =\u003e {\n  const g = $(\u0027rot\u0027);\n  g.style.transition = ms ? `transform ${ms}ms cubic-bezier(.12,.6,.1,1)` : \u0027none\u0027;\n  g.style.transform = `rotate(${deg}deg)`;\n};\nfunction drift() {\n  cancelAnimationFrame(raf);\n  const step = () =\u003e { rot += .06; setRot(rot, 0); raf = requestAnimationFrame(step); };\n  raf = requestAnimationFrame(step);\n}\nfunction spin() {\n  cancelAnimationFrame(raf);\n  const ms = 6000, target = Math.ceil(rot / 360) * 360 + 360 * (5 + Math.floor(Math.random() * 2)) - Math.floor(Math.random() * 12) * 30 + (Math.random() - .5) * 18;\n  setRot(rot, 0); void $(\u0027rot\u0027).getBoundingClientRect();\n  setRot(target, ms);\n  setTimeout(() =\u003e { rot = target % 360; setRot(rot, 0); drift(); setTimeout(spin, 7000); }, ms + 300);\n}\nif (!reduceMotion) { drift(); setTimeout(spin, 2500); }\n\n/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",

003e\u003cb\u003e2\u003c/b\u003eAbra a bola e leia o bilhete\u003c/li\u003e\n        \u003cli\u003e\u003cb\u003e3\u003c/b\u003eRespondeu certo? Leve um brinde\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cp class=\"note\"\u003e\u0026gt; Pegou o phishing? Fica sem nada.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"when-block\"\u003e\u003cdiv class=\"tag live\"\u003eQuarta-feira - 25/11\u003c/div\u003e\u003cdiv class=\"when\"\u003e10h às 16h\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"when-block\" id=\"whereRow\" hidden\u003e\u003cdiv class=\"tag\"\u003eOnde\u003c/div\u003e\u003cdiv class=\"where\" id=\"where\"\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n/* Só para exibir: uma garra pega uma bola, levanta e solta de volta; sem toque e sem registro de dados. */\nconst LOCAL = \u0027Corredor do 1º andar\u0027;   // local da garra; vazio = a linha \"Onde\" não aparece\nif (LOCAL) { document.getElementById(\u0027where\u0027).textContent = LOCAL; document.getElementById(\u0027whereRow\u0027).hidden = false; }\n\nconst $ = id =\u003e document.getElementById(id);\nconst reduceMotion = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n\nconst CX = 310, BALL_Y = 486, REST = 150, HOLD_Y = 230;     // eixo da garra, posição da bola no chão, cabeça em repouso e bola no ar\nconst GRAB = BALL_Y - 74;                                    // altura da cabeça quando a garra fecha na bola\nfunction drawClaw(headY, g) {\n  for (const id of [\u0027cable0\u0027, \u0027cable\u0027, \u0027stream\u0027]) $(id).setAttribute(\u0027y2\u0027, headY - 22);\n  $(\u0027head\u0027).setAttribute(\u0027transform\u0027, `translate(${CX} ${headY})`);\n  const ex = 104 - 38 * g, tx = 98 - 44 * g;                 // cotovelo e ponta: abertos = 104 e 98; fechados = 66 e 54\n  const dl = `M-16 10 L${-ex} 54 L${-tx} 98`, dr = `M16 10 L${ex} 54 L${tx} 98`;\n  $(\u0027pl\u0027).setAttribute(\u0027d\u0027, dl); $(\u0027pl0\u0027).setAttribute(\u0027d\u0027, dl);\n  $(\u0027pr\u0027).setAttribute(\u0027d\u0027, dr); $(\u0027pr0\u0027).setAttribute(\u0027d\u0027, dr);\n  $(\u0027jl\u0027).setAttribute(\u0027cx\u0027, -ex); $(\u0027jl\u0027).setAttribute(\u0027cy\u0027, 54);\n  $(\u0027jr\u0027).setAttribute(\u0027cx\u0027, ex); $(\u0027jr\u0027).setAttribute(\u0027cy\u0027, 54);\n}\nconst setBall = (y, s = 1) =\u003e $(\u0027ball\u0027).setAttribute(\u0027transform\u0027, `translate(${CX} ${y}) scale(${s})`);\nconst ease = t =\u003e t \u003c .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\nconst seg = (t, a, b) =\u003e ease(Math.min(1, Math.max(0, (t - a) / (b - a))));\nconst lerp = (a, b, k) =\u003e a + (b - a) * k;\n\n/* um ciclo (segundos): desce, fecha, sobe com a bola, solta e a bola cai de volta */\nconst T = 9.4;\nlet t0 = performance.now(), raf = 0;\nfunction frame(now) {\n  let t = (now - t0) / 1000;\n  if (t \u003e= T) { t0 = now; t = 0; }\n  const headY = t \u003c .8 ? REST : t \u003c 2.8 ? lerp(REST, GRAB, seg(t, .8, 2.8)) : t \u003c 3.4 ? GRAB : t \u003c 5 ? lerp(GRAB, HOLD_Y - 74, seg(t, 3.4, 5)) : t \u003c 7 ? HOLD_Y - 74 : lerp(HOLD_Y - 74, REST, seg(t, 7, 8.4));\n  const g = t \u003c 2.8 ? 0 : t \u003c 3.4 ? seg(t, 2.8, 3.4) : t \u003c 6.2 ? 1 : t \u003c 6.7 ? 1 - seg(t, 6.2, 6.7) : 0;\n  drawClaw(headY, g);\n  const held = t \u003e= 3.4 \u0026\u0026 t \u003c 6.2;\n  const ballY = held ? headY + 74 : t \u003e= 6.2 \u0026\u0026 t \u003c 7.1 ? lerp(HOLD_Y, BALL_Y, Math.pow(seg(t, 6.2, 7.1), 1.8)) : BALL_Y;\n  setBall(ballY, held ? 1 + .03 * Math.sin(t * 8) : 1);\n  const ringK = t \u003e= 2.8 \u0026\u0026 t \u003c 3.8 ? (t - 2.8) : -1;                                   // onda ao fechar na bola\n  $(\u0027ring\u0027).setAttribute(\u0027r\u0027, 62 + (ringK \u003c 0 ? 0 : ringK * 70)); $(\u0027ring\u0027).setAttribute(\u0027opacity\u0027, ringK \u003c 0 ? 0 : 1 - ringK);\n  const lift = Math.max(0, BALL_Y - ballY) / (BALL_Y - HOLD_Y);                           // a sombra encolhe com a bola no ar\n  $(\u0027shadow\u0027).setAttribute(\u0027rx\u0027, 96 - 34 * lift);\n  if (!reduceMotion) raf = requestAnimationFrame(frame);\n}\ndrawClaw(REST, 0); setBall(BALL_Y);\nif (!reduceMotion) {\n  raf = requestAnimationFrame(frame);\n  document.addEventListener(\u0027visibilitychange\u0027, () =\u003e { if (!document.hidden) { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); } });   // retoma se a aba ficou escondida\n}\n\n/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"];
const SECONDS = Math.max(6, +new URLSearchParams(location.search).get('s') || 15);

const frames = PAGES.map(() => {
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  document.body.appendChild(f);
  return f;
});
let cur = -1;
function show(i) {
  const f = frames[i];
  let done = false;
  const go = () => {
    if (done) return; done = true;
    if (cur >= 0 && cur !== i) frames[cur].classList.remove('on');
    f.classList.add('on'); cur = i;
    setTimeout(() => show((i + 1) % PAGES.length), SECONDS * 1000);
  };
  f.onload = () => setTimeout(go, 300);
  setTimeout(go, 3000);                                            // se demorar a carregar, segue mesmo assim
  f.srcdoc = PAGES[i] + '<!-- ' + Date.now() + ' -->';             // recarrega o banner para a animação recomeçar do início
}
show(0);
/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */
(function cursorAuto() {
  let t = 0;
  const hide = () => { document.body.style.cursor = 'none'; };
  const show = () => { document.body.style.cursor = ''; clearTimeout(t); t = setTimeout(hide, 3000); };
  addEventListener('mousemove', show); show();
})();</script>
