<script>
const PAGES = ["\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"dark\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#002233\"\u003e\n\u003cmeta name=\"robots\" content=\"noindex,nofollow\"\u003e\n\u003ctitle\u003eShield Spin · Chamada · Cyber Shield Game\u003c/title\u003e\n\u003cstyle\u003e\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 300; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Light.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 400; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Regular.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 600; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-SemiBold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 700; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Bold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 800; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-ExtraBold.ttf\u0027) format(\u0027truetype\u0027); }\n  :root {\n    --bg0: #002233; --bg1: #002233;\n    /* paleta do jogo: apenas estas cores, mais branco */\n    --purple: #A44DFF; --pink: #FF009E; --cyan: #00DBFF; --mint: #00FFD4; --lime: #D9FF65; --orange: #FF8900;\n    --line: rgba(164,77,255,.45); --text: #FFFFFF; --muted: rgba(255,255,255,.72);\n    --grad: linear-gradient(90deg, #A44DFF, #FF009E);   /* único gradiente do jogo */\n    --label: \u0027TOTVS\u0027, Verdana, sans-serif;\n    --sans: Verdana, sans-serif;\n    --display: \u0027TOTVS\u0027, Verdana, sans-serif;\n    --u: min(1vw, 1.65vh);   /* unidade fluida: tudo se ajusta ao tamanho da tela, de notebook a TV 4K */\n  }\n  @media (max-aspect-ratio: 7/5) { :root { --u: min(1.7vw, 1.1vh); } }   /* telas \"em pé\": layout empilhado */\n  * { box-sizing: border-box; }\n  html, body { height: 100%; }\n  body {\n    margin: 0; overflow: hidden; color: var(--text); font: calc(var(--u) * 1.5)/1.45 var(--sans);\n    user-select: none; -webkit-user-select: none;\n    /* mesmo fundo do quiz e da roleta */\n    background:\n      radial-gradient(calc(var(--u) * 61) calc(var(--u) * 31) at 50% -12%, rgba(164,77,255,.42), transparent 62%),\n      radial-gradient(calc(var(--u) * 39) calc(var(--u) * 27) at 100% 100%, rgba(255,0,158,.16), transparent 60%),\n      radial-gradient(calc(var(--u) * 33) calc(var(--u) * 23) at 0% 70%, rgba(164,77,255,.12), transparent 60%),\n      linear-gradient(180deg, var(--bg0), var(--bg1));\n    background-attachment: fixed;\n  }\n  h1, p { margin: 0; }\n  h1 { font-family: var(--display); line-height: 1.05; letter-spacing: -.02em; }\n  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(164,77,255,.35)); }\n  .tag { font: 700 calc(var(--u) * 1.3)/1 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }\n  .tag::before { content: \"// \"; color: var(--muted); }\n\n  /* ---------- cenário ---------- */\n  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }\n  .floor { position: absolute; left: -50%; right: -50%; bottom: -2%; height: 46vh;\n    background: repeating-linear-gradient(90deg, rgba(164,77,255,.35) 0 1px, transparent 1px 64px), repeating-linear-gradient(0deg, rgba(164,77,255,.35) 0 1px, transparent 1px 48px);\n    transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%;\n    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);\n    opacity: .42; animation: run 2.4s linear infinite; }\n  @keyframes run { to { background-position: 0 0, 0 48px; } }\n  .rain { position: absolute; top: 0; font: calc(var(--u) * .62)/1.7 var(--sans); color: var(--purple); opacity: .06; white-space: pre; animation: fall linear infinite; }\n  @keyframes fall { from { transform: translateY(-60%); } to { transform: translateY(100vh); } }\n  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,34,51,.45)); }\n  @keyframes blink { 50% { opacity: .25; } }\n\n  /* ---------- palco ---------- */\n  #stage { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; grid-template-rows: minmax(0, 1fr); gap: calc(var(--u) * 3);\n    padding: calc(var(--u) * 3) calc(var(--u) * 4); }\n  .wheelbox { display: grid; place-items: center; min-height: 0; min-width: 0; }\n  .wheelwrap { position: relative; width: min(100%, calc(100vh - var(--u) * 8), calc(100dvh - var(--u) * 8)); aspect-ratio: 1; filter: drop-shadow(0 0 40px rgba(164,77,255,.25)); }\n  .wheelwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }\n  .pointer { position: absolute; top: 0; left: 50%; width: 8%; aspect-ratio: 1; transform: translate(-50%, 2%); background: var(--lime);\n    clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(0 0 10px var(--lime)); z-index: 2; }\n  #rot { transform-origin: 0 0; will-change: transform; }\n  .ss { fill: rgba(0,219,255,.24); } .sp { fill: rgba(217,255,101,.2); } .sg { fill: url(#gGold); }\n  .ls { font: 700 21px var(--display); fill: #FFFFFF; letter-spacing: .01em; }\n  .lg { font: 800 20px var(--display); fill: #FFFFFF; letter-spacing: .05em; }\n  .legend { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1) calc(var(--u) * 2.4); margin-top: calc(var(--u) * 1.8); font: 700 calc(var(--u) * 1.35) var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }\n  .legend span { display: inline-flex; align-items: center; gap: calc(var(--u) * .8); }\n  .sw { display: inline-block; width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); border: 1px solid rgba(164,77,255,.6); border-radius: 3px; }\n  .sw.ss { background: rgba(0,219,255,.24); } .sw.sp { background: rgba(217,255,101,.2); } .sw.sg { background: linear-gradient(180deg, #A44DFF, #FF009E); border-color: #FFFFFF; }\n\n  /* ---------- chamada ---------- */\n  .side { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 2.2); }\n  .side h1 { font-size: calc(var(--u) * 5.2); font-weight: 800; text-transform: uppercase; }\n  .call { font: 800 calc(var(--u) * 2.5)/1.2 var(--display); letter-spacing: -.01em; }\n  .lead { font-size: calc(var(--u) * 1.65); line-height: 1.4; color: var(--text); }\n  .lead b { color: var(--lime); font-weight: 700; }\n\n  .panel { --c: var(--purple); --s: calc(var(--u) * 1.6); --t: 3px; position: relative; display: grid; gap: calc(var(--u) * 2); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.8); border: 1px solid var(--line); border-radius: 4px;\n    background:\n      linear-gradient(var(--c), var(--c)) top left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) top right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top right / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--s) no-repeat,\n      rgba(0,34,51,.92);\n    box-shadow: 0 0 40px rgba(164,77,255,.18); }\n  .info { display: grid; gap: calc(var(--u) * .7); }\n  .info + .info { padding-top: calc(var(--u) * 2); border-top: 1px solid var(--line); }\n  .live { display: inline-flex; align-items: center; gap: calc(var(--u) * .9); color: var(--pink); }\n  .live::after { content: \"\"; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; background: var(--pink); box-shadow: 0 0 12px var(--pink); animation: blink 1.4s ease-in-out infinite; }\n  .when { font: 800 calc(var(--u) * 5)/1 var(--display); letter-spacing: -.02em; }\n  .where { font: 800 calc(var(--u) * 3.3)/1.1 var(--display); letter-spacing: -.01em; }\n\n  /* telas \"em pé\": roda em cima, chamada embaixo */\n  @media (max-aspect-ratio: 7/5) {\n    #stage { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3); }\n    .wheelbox { width: 100%; }\n    .wheelwrap { width: min(100%, 40vh, 40dvh); }\n    .side { width: 100%; }\n    .side h1 { font-size: calc(var(--u) * 5.6); }\n    .when { font-size: calc(var(--u) * 5.4); } .where { font-size: calc(var(--u) * 3.6); } .call { font-size: calc(var(--u) * 2.8); }\n  }\n  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"scene\" aria-hidden=\"true\"\u003e\u003cdiv class=\"floor\"\u003e\u003c/div\u003e\u003cdiv id=\"rain\"\u003e\u003c/div\u003e\u003cdiv class=\"vignette\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cmain id=\"stage\"\u003e\n  \u003csection class=\"wheelbox\" aria-label=\"Roleta\"\u003e\n    \u003cdiv class=\"wheelwrap\"\u003e\n      \u003cdiv class=\"pointer\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003csvg viewBox=\"-310 -310 620 620\" role=\"img\" aria-label=\"Shield Spin, roleta com 12 fatias: 5 de segurança, 5 de privacidade e 2 de Proteção Total\"\u003e\n        \u003cdefs\u003e\n          \u003clinearGradient id=\"gGold\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"\u003e\u003cstop offset=\"0\" stop-color=\"#A44DFF\"/\u003e\u003cstop offset=\"1\" stop-color=\"#FF009E\"/\u003e\u003c/linearGradient\u003e\n          \u003clinearGradient id=\"gRim\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"\u003e\u003cstop offset=\"0\" stop-color=\"#A44DFF\"/\u003e\u003cstop offset=\"1\" stop-color=\"#FF009E\"/\u003e\u003c/linearGradient\u003e\n        \u003c/defs\u003e\n        \u003ccircle r=\"304\" fill=\"none\" stroke=\"url(#gRim)\" stroke-width=\"8\"/\u003e\n        \u003cg id=\"rot\"\u003e\u003cg id=\"slices\"\u003e\u003c/g\u003e\u003c/g\u003e\n        \u003ccircle r=\"52\" fill=\"#002233\" stroke=\"url(#gRim)\" stroke-width=\"5\"/\u003e\n        \u003cpath d=\"M0 -26 L22 -18 V3 C22 17 12 25 0 31 C-12 25 -22 17 -22 3 V-18 Z\" fill=\"rgba(164,77,255,.18)\" stroke=\"url(#gRim)\" stroke-width=\"3\" stroke-linejoin=\"round\"/\u003e\n        \u003ccircle cx=\"0\" cy=\"-3\" r=\"5\" fill=\"#D9FF65\"/\u003e\n      \u003c/svg\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n  \u003csection class=\"side\"\u003e\n    \u003cdiv\u003e\n      \u003cdiv class=\"tag\"\u003eCyber Shield Game\u003c/div\u003e\n      \u003ch1\u003e\u003cspan class=\"grad\"\u003eShield Spin\u003c/span\u003e\u003c/h1\u003e\n      \u003cdiv class=\"legend\" aria-hidden=\"true\"\u003e\u003cspan\u003e\u003ci class=\"sw ss\"\u003e\u003c/i\u003eSegurança\u003c/span\u003e\u003cspan\u003e\u003ci class=\"sw sp\"\u003e\u003c/i\u003ePrivacidade\u003c/span\u003e\u003cspan\u003e\u003ci class=\"sw sg\"\u003e\u003c/i\u003eProteção Total\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cp class=\"call\"\u003eAceita o desafio de proteger a TOTVS?\u003c/p\u003e\n    \u003cp class=\"lead\"\u003eGire a roda, enfrente uma situação de segurança ou de privacidade e \u003cb\u003eacerte o quiz para levar um brinde\u003c/b\u003e. Caiu em Proteção Total? Passe no desafio e leve um prêmio!\u003c/p\u003e\n    \u003cdiv class=\"panel\"\u003e\n      \u003cdiv class=\"info\"\u003e\u003cdiv class=\"tag live\"\u003eAcontecendo hoje\u003c/div\u003e\u003cdiv class=\"when\"\u003e\u003cspan class=\"grad\"\u003e11h às 15h\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"info\"\u003e\u003cdiv class=\"tag\"\u003eOnde\u003c/div\u003e\u003cdiv class=\"where\"\u003eCorredor do 1º andar\u003c/div\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n/* Mesma roda do jogo (roleta.html), só para exibir: gira sozinha, sem toque e sem registro de dados. */\nconst $ = id =\u003e document.getElementById(id);\nconst SLICES = [   // mesma ordem da roleta: segurança e privacidade alternadas, com 2 fatias de Proteção Total\n  { gold: true, label: \u0027PROTEÇÃO TOTAL\u0027 }, { kind: \u0027s\u0027, label: \u0027Caiu no phishing\u0027 }, { kind: \u0027p\u0027, label: \u0027Dados na IA\u0027 }, { kind: \u0027s\u0027, label: \u0027Senha vazada\u0027 },\n  { kind: \u0027p\u0027, label: \u0027Destino errado\u0027 }, { kind: \u0027s\u0027, label: \u0027Ransomware\u0027 }, { gold: true, label: \u0027PROTEÇÃO TOTAL\u0027 }, { kind: \u0027p\u0027, label: \u0027Selfie reveladora\u0027 },\n  { kind: \u0027s\u0027, label: \u0027Wi-Fi falso\u0027 }, { kind: \u0027p\u0027, label: \u0027Dados demais\u0027 }, { kind: \u0027s\u0027, label: \u0027Pendrive-isca\u0027 }, { kind: \u0027p\u0027, label: \u0027Base aberta\u0027 },\n];\nconst esc = s =\u003e String(s).replace(/[\u0026\u003c\u003e\"\u0027]/g, c =\u003e ({ \u0027\u0026\u0027: \u0027\u0026amp;\u0027, \u0027\u003c\u0027: \u0027\u0026lt;\u0027, \u0027\u003e\u0027: \u0027\u0026gt;\u0027, \u0027\"\u0027: \u0027\u0026quot;\u0027, \"\u0027\": \u0027\u0026#39;\u0027 }[c]));\nconst shuffle = a =\u003e { a = a.slice(); for (let i = a.length - 1; i \u003e 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst R = 290;\nconst pt = (deg, r) =\u003e { const a = deg * Math.PI / 180; return [(r * Math.sin(a)).toFixed(2), (-r * Math.cos(a)).toFixed(2)]; };\nconst reduceMotion = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n\n$(\u0027slices\u0027).innerHTML = SLICES.map((s, i) =\u003e {\n  const c = i * 30, [x1, y1] = pt(c - 15, R), [x2, y2] = pt(c + 15, R);\n  const cls = s.gold ? \u0027sg\u0027 : (s.kind === \u0027p\u0027 ? \u0027sp\u0027 : \u0027ss\u0027);\n  return `\u003cg\u003e\u003cpath class=\"${cls}\" d=\"M0 0 L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z\" stroke=\"rgba(164,77,255,.55)\" stroke-width=\"2\"/\u003e\n    \u003ctext class=\"${s.gold ? \u0027lg\u0027 : \u0027ls\u0027}\" transform=\"rotate(${c - 90}) translate(${R - 20},0)\" text-anchor=\"end\" dominant-baseline=\"central\"\u003e${esc(s.label)}\u003c/text\u003e\u003c/g\u003e`;\n}).join(\u0027\u0027);\n\n/* Gira devagar o tempo todo e, de tempos em tempos, dá um giro completo que desacelera como no jogo. */\nlet rot = 0, raf = 0;\nconst setRot = (deg, ms) =\u003e {\n  const g = $(\u0027rot\u0027);\n  g.style.transition = ms ? `transform ${ms}ms cubic-bezier(.12,.6,.1,1)` : \u0027none\u0027;\n  g.style.transform = `rotate(${deg}deg)`;\n};\nfunction drift() {\n  cancelAnimationFrame(raf);\n  const step = () =\u003e { rot += .06; setRot(rot, 0); raf = requestAnimationFrame(step); };\n  raf = requestAnimationFrame(step);\n}\nfunction spin() {\n  cancelAnimationFrame(raf);\n  const ms = 6000, target = Math.ceil(rot / 360) * 360 + 360 * (5 + Math.floor(Math.random() * 2)) - Math.floor(Math.random() * 12) * 30 + (Math.random() - .5) * 18;\n  setRot(rot, 0); void $(\u0027rot\u0027).getBoundingClientRect();\n  setRot(target, ms);\n  setTimeout(() =\u003e { rot = target % 360; setRot(rot, 0); drift(); setTimeout(spin, 7000); }, ms + 300);\n}\nif (!reduceMotion) { drift(); setTimeout(spin, 2500); }\n\n/* fundo: colunas de código caindo, como no quiz */\n(function initRain() {\n  const snippets = [\n    \"if (link.suspicious) report();\", \"const mfa = true;\", \"hash(password, salt);\", \"while (alive) { scan(); }\",\n    \"lgpd.consent(user);\", \"firewall.allow(trusted);\", \"token.rotate();\", \"if (!verified) deny();\",\n    \"encrypt(data, key);\", \"audit.log(event);\", \"return \u0027threat_blocked\u0027;\", \"session.expire(15);\",\n    \"patch(vuln.cve);\", \"const zeroTrust = 1;\", \"phishing.detect(mail);\", \"vpn.connect();\",\n  ];\n  const rain = $(\u0027rain\u0027);\n  for (let c = 0; c \u003c 6; c++) {\n    const col = document.createElement(\u0027div\u0027);\n    col.className = \u0027rain\u0027;\n    col.style.left = (c * 17 + Math.random() * 6) + \u0027%\u0027;\n    col.style.animationDuration = (45 + Math.random() * 40) + \u0027s\u0027;\n    col.style.animationDelay = (-Math.random() * 60) + \u0027s\u0027;\n    col.textContent = shuffle(snippets).concat(shuffle(snippets)).join(\u0027\\n\u0027);\n    rain.appendChild(col);\n  }\n})();\n\n/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",
"\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"dark\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#002233\"\u003e\n\u003cmeta name=\"robots\" content=\"noindex,nofollow\"\u003e\n\u003ctitle\u003eGarra do Phishing · Chamada · Cyber Shield Game\u003c/title\u003e\n\u003cstyle\u003e\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 300; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Light.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 400; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Regular.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 600; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-SemiBold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 700; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Bold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 800; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-ExtraBold.ttf\u0027) format(\u0027truetype\u0027); }\n  :root {\n    --bg0: #002233; --bg1: #002233;\n    /* paleta do jogo: apenas estas cores, mais branco */\n    --purple: #A44DFF; --pink: #FF009E; --cyan: #00DBFF; --mint: #00FFD4; --lime: #D9FF65; --orange: #FF8900;\n    /* aqui as cores trocam de papel em relação à roleta (lá: roxo e rosa em destaque; aqui: ciano e menta, com rosa e lima de acento) */\n    --line: rgba(0,219,255,.45); --text: #FFFFFF; --muted: rgba(255,255,255,.72);\n    --grad: linear-gradient(90deg, #FF009E, #A44DFF);   /* o mesmo gradiente do jogo, com a direção invertida */\n    --label: \u0027TOTVS\u0027, Verdana, sans-serif;\n    --sans: Verdana, sans-serif;\n    --display: \u0027TOTVS\u0027, Verdana, sans-serif;\n    --u: min(1vw, 1.65vh);   /* unidade fluida: tudo se ajusta ao tamanho da tela, de notebook a TV 4K */\n  }\n  @media (max-aspect-ratio: 7/5) { :root { --u: min(1.7vw, 1.1vh); } }   /* telas \"em pé\": layout empilhado */\n  * { box-sizing: border-box; }\n  html, body { height: 100%; }\n  body {\n    margin: 0; overflow: hidden; color: var(--text); font: calc(var(--u) * 1.5)/1.45 var(--sans);\n    user-select: none; -webkit-user-select: none;\n    background:\n      radial-gradient(calc(var(--u) * 61) calc(var(--u) * 31) at 50% -12%, rgba(0,219,255,.34), transparent 62%),\n      radial-gradient(calc(var(--u) * 39) calc(var(--u) * 27) at 100% 100%, rgba(217,255,101,.10), transparent 60%),\n      radial-gradient(calc(var(--u) * 33) calc(var(--u) * 23) at 0% 70%, rgba(0,255,212,.10), transparent 60%),\n      linear-gradient(180deg, var(--bg0), var(--bg1));\n    background-attachment: fixed;\n  }\n  h1, p { margin: 0; }\n  h1 { font-family: var(--display); line-height: 1.05; letter-spacing: -.02em; }\n  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(255,0,158,.35)); }\n  .tag { font: 700 calc(var(--u) * 1.3)/1 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--pink); }\n  .tag::before { content: \"// \"; color: var(--muted); }\n\n  /* ---------- cenário ---------- */\n  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }\n  .floor { position: absolute; left: -50%; right: -50%; bottom: -2%; height: 46vh;\n    background: repeating-linear-gradient(90deg, rgba(0,219,255,.32) 0 1px, transparent 1px 64px), repeating-linear-gradient(0deg, rgba(0,219,255,.32) 0 1px, transparent 1px 48px);\n    transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%;\n    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);\n    opacity: .42; animation: run 2.4s linear infinite; }\n  @keyframes run { to { background-position: 0 0, 0 48px; } }\n  .rain { position: absolute; top: 0; font: calc(var(--u) * .62)/1.7 var(--sans); color: var(--cyan); opacity: .07; white-space: pre; animation: fall linear infinite; }\n  @keyframes fall { from { transform: translateY(-60%); } to { transform: translateY(100vh); } }\n  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,34,51,.45)); }\n  @keyframes blink { 50% { opacity: .25; } }\n\n  /* ---------- palco ---------- */\n  #stage { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; grid-template-rows: minmax(0, 1fr); gap: calc(var(--u) * 3);\n    padding: calc(var(--u) * 3) calc(var(--u) * 4); }\n  .artbox { display: grid; place-items: center; min-height: 0; min-width: 0; }\n  .art { position: relative; width: min(100%, calc(100vh - var(--u) * 8), calc(100dvh - var(--u) * 8)); aspect-ratio: 1; }\n  .art svg { width: 100%; height: 100%; display: block; overflow: visible; }\n  .spin { transform-origin: 310px 330px; animation: turn 70s linear infinite; }\n  @keyframes turn { to { transform: rotate(360deg); } }\n  .flow { stroke-dasharray: 3 11; animation: flow .9s linear infinite; }\n  @keyframes flow { to { stroke-dashoffset: -14; } }\n\n  /* ---------- chamada ---------- */\n  .side { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.7); }\n  .side h1 { font-size: calc(var(--u) * 5.2); font-weight: 800; text-transform: uppercase; }\n  .call { font: 800 calc(var(--u) * 2.5)/1.2 var(--display); letter-spacing: -.01em; }\n  .lead { font-size: calc(var(--u) * 1.65); line-height: 1.4; color: var(--text); }\n  .lead b { color: var(--cyan); font-weight: 700; }\n  .how { display: grid; gap: calc(var(--u) * 1); }\n  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 1); font: 700 calc(var(--u) * 1.5) var(--label); color: var(--muted); }\n  .steps b { color: var(--mint); margin-right: .6em; }\n  .note { font: calc(var(--u) * 1.4) var(--label); color: var(--muted); letter-spacing: .04em; }\n\n  .panel { --c: var(--cyan); --s: calc(var(--u) * 1.6); --t: 3px; position: relative; display: grid; gap: calc(var(--u) * 1.5); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.8); border: 1px solid var(--line); border-radius: 4px;\n    background:\n      linear-gradient(var(--c), var(--c)) top left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) top right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top right / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--s) no-repeat,\n      rgba(0,34,51,.92);\n    box-shadow: 0 0 40px rgba(0,219,255,.18); }\n  .info { display: grid; gap: calc(var(--u) * .7); }\n  .info[hidden] { display: none; }\n  .info + .info { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--line); }\n  .live { display: inline-flex; align-items: center; gap: calc(var(--u) * .9); color: var(--lime); }\n  .live::after { content: \"\"; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: blink 1.4s ease-in-out infinite; }\n  .when { font: 800 calc(var(--u) * 5)/1 var(--display); letter-spacing: -.02em; }\n  .where { font: 800 calc(var(--u) * 3.3)/1.1 var(--display); letter-spacing: -.01em; }\n\n  /* telas \"em pé\": arte em cima, chamada embaixo */\n  @media (max-aspect-ratio: 7/5) {\n    #stage { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3); }\n    .artbox { width: 100%; }\n    .art { width: min(100%, 36vh, 36dvh); }\n    .side { width: 100%; }\n    .side h1 { font-size: calc(var(--u) * 5.6); }\n    .when { font-size: calc(var(--u) * 5.4); } .where { font-size: calc(var(--u) * 3.6); } .call { font-size: calc(var(--u) * 2.8); }\n  }\n  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"scene\" aria-hidden=\"true\"\u003e\u003cdiv class=\"floor\"\u003e\u003c/div\u003e\u003cdiv id=\"rain\"\u003e\u003c/div\u003e\u003cdiv class=\"vignette\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cmain id=\"stage\"\u003e\n  \u003csection class=\"artbox\" aria-label=\"Garra pegando uma bola\"\u003e\n    \u003cdiv class=\"art\"\u003e\n      \u003csvg viewBox=\"0 0 620 620\" role=\"img\" aria-label=\"Uma garra neon pega uma bola com um ponto de interrogação\"\u003e\n        \u003cdefs\u003e\n          \u003cfilter id=\"neon\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\"\u003e\n            \u003cfeGaussianBlur stdDeviation=\"5\" result=\"b\"/\u003e\n            \u003cfeMerge\u003e\u003cfeMergeNode in=\"b\"/\u003e\u003cfeMergeNode in=\"b\"/\u003e\u003cfeMergeNode in=\"SourceGraphic\"/\u003e\u003c/feMerge\u003e\n          \u003c/filter\u003e\n          \u003cradialGradient id=\"core\" cx=\"38%\" cy=\"32%\" r=\"75%\"\u003e\n            \u003cstop offset=\"0\" stop-color=\"#FF009E\" stop-opacity=\".55\"/\u003e\u003cstop offset=\".6\" stop-color=\"#FF009E\" stop-opacity=\".16\"/\u003e\u003cstop offset=\"1\" stop-color=\"#FF009E\" stop-opacity=\".05\"/\u003e\n          \u003c/radialGradient\u003e\n        \u003c/defs\u003e\n        \u003c!-- mira de fundo --\u003e\n        \u003cg class=\"spin\" fill=\"none\"\u003e\n          \u003ccircle cx=\"310\" cy=\"330\" r=\"268\" stroke=\"#00DBFF\" stroke-opacity=\".38\" stroke-width=\"2\" stroke-dasharray=\"2 16\" stroke-linecap=\"round\"/\u003e\n        \u003c/g\u003e\n        \u003ccircle cx=\"310\" cy=\"330\" r=\"212\" fill=\"none\" stroke=\"#00DBFF\" stroke-opacity=\".14\" stroke-width=\"2\"/\u003e\n        \u003cpath d=\"M310 40 V70 M310 590 V560 M20 330 H50 M600 330 H570\" stroke=\"#00FFD4\" stroke-opacity=\".5\" stroke-width=\"3\" stroke-linecap=\"round\"/\u003e\n        \u003c!-- chão de luz --\u003e\n        \u003cellipse id=\"shadow\" cx=\"310\" cy=\"548\" rx=\"96\" ry=\"12\" fill=\"#00DBFF\" fill-opacity=\".18\"/\u003e\n        \u003cline x1=\"150\" y1=\"548\" x2=\"470\" y2=\"548\" stroke=\"#00DBFF\" stroke-opacity=\".55\" stroke-width=\"2\"/\u003e\n        \u003c!-- onda do impacto ao pegar --\u003e\n        \u003ccircle id=\"ring\" cx=\"310\" cy=\"486\" r=\"62\" fill=\"none\" stroke=\"#D9FF65\" stroke-width=\"3\" opacity=\"0\"/\u003e\n        \u003c!-- bola --\u003e\n        \u003cg id=\"ball\" filter=\"url(#neon)\"\u003e\n          \u003ccircle r=\"62\" fill=\"url(#core)\" stroke=\"#FF009E\" stroke-width=\"4\"/\u003e\n          \u003cg fill=\"none\" stroke=\"#FF009E\" stroke-opacity=\".6\" stroke-width=\"2\"\u003e\n            \u003cellipse rx=\"62\" ry=\"20\"/\u003e\u003cellipse rx=\"62\" ry=\"40\" opacity=\".6\"/\u003e\u003cellipse rx=\"28\" ry=\"62\"/\u003e\u003cellipse rx=\"48\" ry=\"62\" opacity=\".6\"/\u003e\n          \u003c/g\u003e\n          \u003ctext y=\"19\" text-anchor=\"middle\" font-family=\"TOTVS, Verdana, sans-serif\" font-weight=\"800\" font-size=\"54\" fill=\"#FFFFFF\" stroke=\"none\"\u003e?\u003c/text\u003e\n        \u003c/g\u003e\n        \u003c!-- garra --\u003e\n        \u003cg id=\"claw\" filter=\"url(#neon)\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\n          \u003cline id=\"cable\" x1=\"310\" y1=\"-30\" x2=\"310\" y2=\"150\" stroke=\"#00DBFF\" stroke-width=\"5\"/\u003e\n          \u003cline id=\"stream\" class=\"flow\" x1=\"310\" y1=\"-30\" x2=\"310\" y2=\"150\" stroke=\"#D9FF65\" stroke-width=\"2.5\"/\u003e\n          \u003cg id=\"head\"\u003e\n            \u003cpath d=\"M-28 -2 L-14 -22 H14 L28 -2 L14 18 H-14 Z\" fill=\"rgba(0,34,51,.92)\" stroke=\"#00DBFF\" stroke-width=\"4\"/\u003e\n            \u003ccircle r=\"7\" cy=\"-2\" fill=\"#D9FF65\" stroke=\"none\"/\u003e\n            \u003cpath id=\"pl\" stroke=\"#00FFD4\" stroke-width=\"6\"/\u003e\n            \u003cpath id=\"pr\" stroke=\"#00FFD4\" stroke-width=\"6\"/\u003e\n            \u003ccircle id=\"jl\" r=\"6\" fill=\"#002233\" stroke=\"#D9FF65\" stroke-width=\"3\"/\u003e\n            \u003ccircle id=\"jr\" r=\"6\" fill=\"#002233\" stroke=\"#D9FF65\" stroke-width=\"3\"/\u003e\n          \u003c/g\u003e\n        \u003c/g\u003e\n      \u003c/svg\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n  \u003csection class=\"side\"\u003e\n    \u003cdiv\u003e\n      \u003cdiv class=\"tag\"\u003eCyber Shield Game\u003c/div\u003e\n      \u003ch1\u003e\u003cspan class=\"grad\"\u003eGarra do Phishing\u003c/span\u003e\u003c/h1\u003e\n    \u003c/div\u003e\n    \u003cp class=\"call\"\u003eSerá que você escapa do phishing?\u003c/p\u003e\n    \u003cp class=\"lead\"\u003eA clássica máquina de garra, mas \u003cb\u003eo prêmio não é um ursinho\u003c/b\u003e. Dentro de cada bola há um bilhete: uma pergunta de segurança… ou um phishing.\u003c/p\u003e\n    \u003cdiv class=\"how\"\u003e\n      \u003col class=\"steps\"\u003e\n        \u003cli\u003e\u003cb\u003e1\u003c/b\u003eEspere sua vez e pegue uma bola com a garra\u003c/li\u003e\n        \u003cli\u003e\u003cb\u003e2\u003c/b\u003eAbra a bola e leia o bilhete\u003c/li\u003e\n        \u003cli\u003e\u003cb\u003e3\u003c/b\u003eRespondeu certo? Leve um brinde\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cp class=\"note\"\u003e\u0026gt; Pegou o phishing? Fica sem nada.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"panel\"\u003e\n      \u003cdiv class=\"info\"\u003e\u003cdiv class=\"tag live\"\u003eAmanhã · 24/11\u003c/div\u003e\u003cdiv class=\"when\"\u003e\u003cspan class=\"grad\"\u003e11h às 15h\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"info\" id=\"whereRow\" hidden\u003e\u003cdiv class=\"tag\"\u003eOnde\u003c/div\u003e\u003cdiv class=\"where\" id=\"where\"\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n/* Só para exibir: uma garra neon pega uma bola, levanta e solta de volta; sem toque e sem registro de dados. */\nconst LOCAL = \u0027\u0027;   // local da garra (ex.: \u0027Corredor do 1º andar\u0027); vazio = a linha \"Onde\" não aparece\nif (LOCAL) { document.getElementById(\u0027where\u0027).textContent = LOCAL; document.getElementById(\u0027whereRow\u0027).hidden = false; }\n\nconst $ = id =\u003e document.getElementById(id);\nconst shuffle = a =\u003e { a = a.slice(); for (let i = a.length - 1; i \u003e 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst reduceMotion = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n\nconst CX = 310, BALL_Y = 486, REST = 150, HOLD_Y = 230;     // eixo da garra, posição da bola no chão, cabeça em repouso e bola no ar\nconst GRAB = BALL_Y - 74;                                    // altura da cabeça quando a garra fecha na bola\nfunction drawClaw(headY, g) {\n  $(\u0027cable\u0027).setAttribute(\u0027y2\u0027, headY - 22); $(\u0027stream\u0027).setAttribute(\u0027y2\u0027, headY - 22);\n  $(\u0027head\u0027).setAttribute(\u0027transform\u0027, `translate(${CX} ${headY})`);\n  const ex = 104 - 38 * g, tx = 98 - 44 * g;                 // cotovelo e ponta: abertos = 104 e 98; fechados = 66 e 54\n  $(\u0027pl\u0027).setAttribute(\u0027d\u0027, `M-16 10 L${-ex} 54 L${-tx} 98`);\n  $(\u0027pr\u0027).setAttribute(\u0027d\u0027, `M16 10 L${ex} 54 L${tx} 98`);\n  $(\u0027jl\u0027).setAttribute(\u0027cx\u0027, -ex); $(\u0027jl\u0027).setAttribute(\u0027cy\u0027, 54);\n  $(\u0027jr\u0027).setAttribute(\u0027cx\u0027, ex); $(\u0027jr\u0027).setAttribute(\u0027cy\u0027, 54);\n}\nconst setBall = (y, s = 1) =\u003e $(\u0027ball\u0027).setAttribute(\u0027transform\u0027, `translate(${CX} ${y}) scale(${s})`);\nconst ease = t =\u003e t \u003c .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\nconst seg = (t, a, b) =\u003e ease(Math.min(1, Math.max(0, (t - a) / (b - a))));\nconst lerp = (a, b, k) =\u003e a + (b - a) * k;\n\n/* um ciclo (segundos): desce, fecha, sobe com a bola, solta e a bola cai de volta */\nconst T = 9.4;\nlet t0 = performance.now(), raf = 0;\nfunction frame(now) {\n  let t = (now - t0) / 1000;\n  if (t \u003e= T) { t0 = now; t = 0; }\n  const headY = t \u003c .8 ? REST : t \u003c 2.8 ? lerp(REST, GRAB, seg(t, .8, 2.8)) : t \u003c 3.4 ? GRAB : t \u003c 5 ? lerp(GRAB, HOLD_Y - 74, seg(t, 3.4, 5)) : t \u003c 7 ? HOLD_Y - 74 : lerp(HOLD_Y - 74, REST, seg(t, 7, 8.4));\n  const g = t \u003c 2.8 ? 0 : t \u003c 3.4 ? seg(t, 2.8, 3.4) : t \u003c 6.2 ? 1 : t \u003c 6.7 ? 1 - seg(t, 6.2, 6.7) : 0;\n  drawClaw(headY, g);\n  const held = t \u003e= 3.4 \u0026\u0026 t \u003c 6.2;\n  const ballY = held ? headY + 74 : t \u003e= 6.2 \u0026\u0026 t \u003c 7.1 ? lerp(HOLD_Y, BALL_Y, Math.pow(seg(t, 6.2, 7.1), 1.8)) : t \u003e= 7.1 ? BALL_Y : BALL_Y;\n  setBall(ballY, held ? 1 + .03 * Math.sin(t * 8) : 1);\n  const ringK = t \u003e= 2.8 \u0026\u0026 t \u003c 3.8 ? (t - 2.8) : -1;                                   // onda ao fechar na bola\n  $(\u0027ring\u0027).setAttribute(\u0027r\u0027, 62 + (ringK \u003c 0 ? 0 : ringK * 70)); $(\u0027ring\u0027).setAttribute(\u0027opacity\u0027, ringK \u003c 0 ? 0 : 1 - ringK);\n  $(\u0027ring\u0027).setAttribute(\u0027cy\u0027, BALL_Y);\n  const lift = Math.max(0, BALL_Y - ballY) / (BALL_Y - HOLD_Y);                           // a sombra encolhe com a bola no ar\n  $(\u0027shadow\u0027).setAttribute(\u0027rx\u0027, 96 - 34 * lift); $(\u0027shadow\u0027).setAttribute(\u0027fill-opacity\u0027, .18 - .08 * lift);\n  if (!reduceMotion) raf = requestAnimationFrame(frame);\n}\ndrawClaw(REST, 0); setBall(BALL_Y);\nif (!reduceMotion) {\n  raf = requestAnimationFrame(frame);\n  document.addEventListener(\u0027visibilitychange\u0027, () =\u003e { if (!document.hidden) { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); } });   // retoma se a aba ficou escondida\n}\n\n/* fundo: colunas de código caindo, como no quiz */\n(function initRain() {\n  const snippets = [\n    \"if (link.suspicious) report();\", \"const mfa = true;\", \"hash(password, salt);\", \"while (alive) { scan(); }\",\n    \"lgpd.consent(user);\", \"firewall.allow(trusted);\", \"token.rotate();\", \"if (!verified) deny();\",\n    \"encrypt(data, key);\", \"audit.log(event);\", \"return \u0027threat_blocked\u0027;\", \"session.expire(15);\",\n    \"patch(vuln.cve);\", \"const zeroTrust = 1;\", \"phishing.detect(mail);\", \"vpn.connect();\",\n  ];\n  const rain = $(\u0027rain\u0027);\n  for (let c = 0; c \u003c 6; c++) {\n    const col = document.createElement(\u0027div\u0027);\n    col.className = \u0027rain\u0027;\n    col.style.left = (c * 17 + Math.random() * 6) + \u0027%\u0027;\n    col.style.animationDuration = (45 + Math.random() * 40) + \u0027s\u0027;\n    col.style.animationDelay = (-Math.random() * 60) + \u0027s\u0027;\n    col.textContent = shuffle(snippets).concat(shuffle(snippets)).join(\u0027\\n\u0027);\n    rain.appendChild(col);\n  }\n})();\n\n/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"];
const SECONDS = Math.max(6, +new URLSearchParams(location.search).get('s') || 15);

const frames = PAGES.map(() => {
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  document.body.appendChild(f);
  return f;
});
let cur = -1;
function show(i) {
  const f = frames[i];
  let done = false;
  const go = () => {
    if (done) return; done = true;
    if (cur >= 0 && cur !== i) frames[cur].classList.remove('on');
    f.classList.add('on'); cur = i;
    setTimeout(() => show((i + 1) % PAGES.length), SECONDS * 1000);
  };
  f.onload = () => setTimeout(go, 300);
  setTimeout(go, 3000);                                            // se demorar a carregar, segue mesmo assim
  f.srcdoc = PAGES[i] + '<!-- ' + Date.now() + ' -->';             // recarrega o banner para a animação recomeçar do início
}
show(0);
/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */
(function cursorAuto() {
  let t = 0;
  const hide = () => { document.body.style.cursor = 'none'; };
  const show = () => { document.body.style.cursor = ''; clearTimeout(t); t = setTimeout(hide, 3000); };
  addEventListener('mousemove', show); show();
})();</script>
