or(Math.random() * 2)) - Math.floor(Math.random() * SLICES.length) * STEP + (Math.random() - .5) * STEP * .6;\n  setRot(rot, 0); void $(\u0027rot\u0027).getBoundingClientRect();\n  setRot(target, ms);\n  setTimeout(() =\u003e { rot = target % 360; setRot(rot, 0); drift(); setTimeout(spin, 7000); }, ms + 300);\n}\nif (!reduceMotion) { drift(); setTimeout(spin, 2500); }\n\n/* fundo: colunas de código caindo, como no jogo */\n(function initRain() {\n  const snippets = [\n    \"if (link.suspicious) report();\", \"const mfa = true;\", \"hash(password, salt);\", \"while (alive) { scan(); }\",\n    \"lgpd.consent(user);\", \"firewall.allow(trusted);\", \"token.rotate();\", \"if (!verified) deny();\",\n    \"encrypt(data, key);\", \"audit.log(event);\", \"return \u0027threat_blocked\u0027;\", \"session.expire(15);\",\n    \"patch(vuln.cve);\", \"const zeroTrust = 1;\", \"phishing.detect(mail);\", \"vpn.connect();\",\n  ];\n  const rain = $(\u0027rain\u0027);\n  for (let c = 0; c \u003c 6; c++) {\n    const col = document.createElement(\u0027div\u0027);\n    col.className = \u0027rain\u0027;\n    col.style.left = (c * 17 + Math.random() * 6) + \u0027%\u0027;\n    col.style.animationDuration = (45 + Math.random() * 40) + \u0027s\u0027;\n    col.style.animationDelay = (-Math.random() * 60) + \u0027s\u0027;\n    col.textContent = shuffle(snippets).concat(shuffle(snippets)).join(\u0027\\n\u0027);\n    rain.appendChild(col);\n  }\n})();\n\n/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",
"\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"dark\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#002233\"\u003e\n\u003cmeta name=\"robots\" content=\"noindex,nofollow\"\u003e\n\u003ctitle\u003eGarra do Phishing · Chamada · Semana de Segurança e Privacidade\u003c/title\u003e\n\u003cstyle\u003e\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 300; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Light.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 400; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Regular.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 600; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-SemiBold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 700; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Bold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 800; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-ExtraBold.ttf\u0027) format(\u0027truetype\u0027); }\n  :root {\n    /* paleta TOTVS */\n    --azul-escuro: #002233; --azul: #00DBFF; --roxo: #A44DFF; --rosa: #FF009E; --verde: #00FFD4; --limao: #D9FF65; --laranja: #FF8900; --branco: #FFFFFF;\n    --fonte: \u0027TOTVS\u0027, Verdana, sans-serif;     /* TOTVS em todo o texto; Verdana só se a TOTVS não carregar */\n    --u: min(1vw, 1.65vh);                      /* unidade fluida: tudo se ajusta ao tamanho da tela, de notebook a TV 4K */\n  }\n  @media (max-aspect-ratio: 7/5) { :root { --u: min(1.7vw, 1.1vh); } }   /* telas \"em pé\": layout empilhado */\n  * { box-sizing: border-box; }\n  html, body { height: 100%; }\n  html { background: #002233; }\n  body { margin: 0; overflow: hidden; color: var(--branco); font: 400 calc(var(--u) * 1.5)/1.45 var(--fonte); user-select: none; -webkit-user-select: none; background: #002233; }\n  h1, p { margin: 0; }\n  h1 { font: 700 calc(var(--u) * 4)/1.05 var(--fonte); letter-spacing: -.02em; text-transform: uppercase; color: var(--rosa); }\n  .tag { font: 700 calc(var(--u) * 1.25)/1.3 var(--fonte); letter-spacing: .16em; text-transform: uppercase; color: var(--rosa); }\n  .tag.eyebrow { color: var(--branco); }   /* \"Semana de Segurança e Privacidade\" em branco */\n\n  /* ---------- fundo: rede e código animados (o mesmo da roleta) ---------- */\n  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }\n  .floor { position: absolute; left: -50%; right: -50%; bottom: -2%; height: 46vh;\n    background: repeating-linear-gradient(90deg, rgba(164,77,255,.35) 0 max(1px, calc(var(--u) * .08)), transparent max(1px, calc(var(--u) * .08)) calc(var(--u) * 3.6)), repeating-linear-gradient(0deg, rgba(164,77,255,.35) 0 max(1px, calc(var(--u) * .08)), transparent max(1px, calc(var(--u) * .08)) calc(var(--u) * 2.7));\n    transform: perspective(calc(var(--u) * 23.6)) rotateX(62deg); transform-origin: 50% 100%;\n    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);\n    opacity: .42; animation: run 2.4s linear infinite; }\n  @keyframes run { to { background-position: 0 0, 0 calc(var(--u) * 2.7); } }\n  .rain { position: absolute; top: 0; font: calc(var(--u) * .62)/1.7 var(--fonte); color: var(--roxo); opacity: .06; white-space: pre; animation: fall linear infinite; }\n  @keyframes fall { from { transform: translateY(-60%); } to { transform: translateY(100vh); } }\n\n  /* ---------- palco ---------- */\n  #stage { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: g ear-gradient(var(--c), var(--c)) bottom left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--s) no-repeat,\n      linear-gradient(var(--c), var(--c)) bottom right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--s) no-repeat,\n      var(--azul-escuro);\n    box-shadow: 0 0 40px rgba(0,219,255,.07), inset 0 0 40px rgba(0,219,255,.04); }   /* mesmo efeito de borda da caixa da roleta, na cor da garra */\n  .info { display: grid; gap: calc(var(--u) * .6); }\n  .info[hidden] { display: none; }\n  .info + .info { padding-top: calc(var(--u) * 1.1); border-top: 2px solid var(--azul); }\n  .live { display: inline-flex; align-items: center; gap: calc(var(--u) * .9); color: var(--rosa); }\n  .live::after { content: \"\"; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; background: var(--rosa); animation: blink 1.4s ease-in-out infinite; }\n  @keyframes blink { 50% { opacity: .25; } }\n  .when { font: 800 calc(var(--u) * 4.4)/1 var(--fonte); letter-spacing: -.02em; color: var(--branco); }\n  .where { font: 700 calc(var(--u) * 2.9)/1.1 var(--fonte); letter-spacing: -.01em; }\n\n  /* assinatura oficial TOTVS, branca, centralizada no fim da tela, sem efeitos */\n  .logo { position: fixed; left: 50%; bottom: calc(var(--u) * 2.4); transform: translateX(-50%); height: calc(var(--u) * 3.4); width: auto; z-index: 5; }\n\n  /* telas \"em pé\": arte em cima, chamada embaixo */\n  @media (max-aspect-ratio: 7/5) {\n    #stage { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 3) calc(var(--u) * 9); }\n    .artbox { width: 100%; }\n    .art { width: min(100%, 30vh, 30dvh); }\n    .side { width: 100%; }\n    h1 { font-size: calc(var(--u) * 4.6); }\n    .when { font-size: calc(var(--u) * 4.6); } .where { font-size: calc(var(--u) * 3.2); } .call {     \u003cp class=\"lead\"\u003eA clássica máquina de garra, mas \u003cb\u003eo prêmio não é um ursinho\u003c/b\u003e. Dentro de cada bola há um bilhete: uma pergunta de segurança… ou um phishing.\u003c/p\u003e\n    \u003cdiv class=\"how\"\u003e\n      \u003col class=\"steps\"\u003e\n        \u003cli\u003e\u003cb\u003e1\u003c/b\u003eEspere sua vez e pegue uma bola com a garra\u003c/li\u003e\n        \u003cli\u003e\u003cb\u003e2\u003c/b\u003eAbra a bola e leia o bilhete\u003c/li\u003e\n        \u003cli\u003e\u003cb\u003e3\u003c/b\u003eRespondeu certo? Leve um brinde\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cp class=\"note\"\u003e\u0026gt; Pegou o phishing? Fica sem nada.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"panel\"\u003e\n      \u003cdiv class=\"info\"\u003e\u003cdiv class=\"tag live\"\u003eQuarta-feira - 25/11\u003c/div\u003e\u003cdiv class=\"when\"\u003e10h às 16h\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"info\" id=\"whereRow\" hidden\u003e\u003cdiv class=\"tag\"\u003eOnde\u003c/div\u003e\u003cdiv class=\"where\" id=\"where\"\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\u003c/main\u003e\n\u003csvg class=\"logo\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" viewBox=\"0 0 302 92\" role=\"img\" aria-label=\"TOTVS\"\u003e\n  \u003cdefs\u003e\n    \u003cstyle\u003e\n      .st0 {\n        fill: #fff;\n      }\n    \u003c/style\u003e\n  \u003c/defs\u003e\n  \u003cpath class=\"st0\" d=\"M75.8,22.7c-.4-1.6-1.4-3-2.9-4-7.5-5.6-16.4-9.8-26.1-12.4-.9-.2-1.9-.4-2.9-.4s-2,.1-2.9.4c-9.7,2.5-18.6,6.7-26.1,12.4-1.4,1.1-2.4,2.5-2.9,4-1.1,4.1-1.7,8.3-1.7,12.4v21.7c0,4.2.6,8.3,1.7,12.4.4,1.6,1.4,3,2.9,4,7.5,5.6,16.4,9.8,26.1,12.4.9.2,1.9.4,2.9.4s2-.1,2.9-.4c9.7-2.5,18.6-6.7,26.1-12.4,1.4-1.1,2.4-2.5,2.9-4,1.1-4.1,1.7-8.3,1.7-12.4v-21.7c0-4.2-.6-8.3-1.7-12.4M74.8,47.4c-.4,1.4-1.3,2.6-2.6,3.6-3.7,2.8-7.7,5.2-12.1,7.2-4.3,2-8.9,3.7-13.7,4.9-.8.2-1.7.3-2.6.3s-1.8-.1-2.6-.3c-4.8-1.2-9.4-2.9-13.7- e sem registro de dados. */\nconst LOCAL = \u0027Corredor do 1º andar\u0027;   // local da garra; vazio = a linha \"Onde\" não aparece\nif (LOCAL) { document.getElementById(\u0027where\u0027).textContent = LOCAL; document.getElementById(\u0027whereRow\u0027).hidden = false; }\n\nconst $ = id =\u003e document.getElementById(id);\nconst shuffle = a =\u003e { a = a.slice(); for (let i = a.length - 1; i \u003e 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst reduceMotion = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n\nconst CX = 310, BALL_Y = 486, REST = 150, HOLD_Y = 230;     // eixo da garra, posição da bola no chão, cabeça em repouso e bola no ar\nconst GRAB = BALL_Y - 74;                                    // altura da cabeça quando a garra fecha na bola\nfunction drawClaw(headY, g) {\n  $(\u0027cable\u0027).setAttribute(\u0027y2\u0027, headY - 22); $(\u0027stream\u0027).setAttribute(\u0027y2\u0027, headY - 22);\n  $(\u0027head\u0027).setAttribute(\u0027transform\u0027, `translate(${CX} ${headY})`);\n  const ex = 104 - 38 * g, tx = 98 - 44 * g;                 // cotovelo e ponta: abertos = 104 e 98; fechados = 66 e 54\n  $(\u0027pl\u0027).setAttribute(\u0027d\u0027, `M-16 10 L${-ex} 54 L${-tx} 98`);\n  $(\u0027pr\u0027).setAttribute(\u0027d\u0027, `M16 10 L${ex} 54 L${tx} 98`);\n  $(\u0027jl\u0027).setAttribute(\u0027cx\u0027, -ex); $(\u0027jl\u0027).setAttribute(\u0027cy\u0027, 54);\n  $(\u0027jr\u0027).setAttribute(\u0027cx\u0027, ex); $(\u0027jr\u0027).setAttribute(\u0027cy\u0027, 54);\n}\nconst setBall = (y, s = 1) =\u003e $(\u0027ball\u0027).setAttribute(\u0027transform\u0027, `translate(${CX} ${y}) scale(${s})`);\nconst ease = t =\u003e t \u003c .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\nconst seg = (t, a, b) =\u003e ease(Math.min(1, Math.max(0, (t - a) / (b - a))));\nconst lerp = (a, b, k) =\u003e a + (b - a) * k;\n\n/* um ciclo (segundos): desce, fecha, sobe com a bola, solta e a bola cai de volta */\nconst T = 9.4;\nlet t0 = performance.now(), raf = 0;\nfunction frame(now) {\n  let t = (now - t0) / 1000;\n  if (t \u003e= T) { t0 = now; t = 0; }\n  const headY = t \u003c .8 ? REST : t \u003c 2.8 ? lerp(REST, GRAB, seg(t, .8, 2.8)) : t \u003c 3.4 ? GRAB : t \u003c 5 ? lerp(GRAB, HOLD_Y - 74, seg(t, 3.4, 5)) : t \u003c 7 ? HOLD_Y - 74 : lerp(HOLD_Y - 74, REST, seg(t, 7, 8.4));\n  const g = t \u003c 2.8 ? 0 : t \u003c 3.4 ? seg(t, 2.8, 3.4) : t \u003c 6.2 ? 1 : t \u003c 6.7 ? 1 - seg(t, 6.2, 6.7) : 0;\n  drawClaw(headY, g);\n  const held = t \u003e= 3.4 \u0026\u0026 t \u003c 6.2;\n  const ballY = held ? headY + 74 : t \u003e= 6.2 \u0026\u0026 t \u003c 7.1 ? lerp(HOLD_Y, BALL_Y, Math.pow(seg(t, 6.2, 7.1), 1.8)) : BALL_Y;\n  setBall(ballY, held ? 1 + .03 * Math.sin(t * 8) : 1);\n  const ringK = t \u003e= 2.8 \u0026\u0026 t \u003c 3.8 ? (t - 2.8) : -1;                                   // onda ao fechar na bola\n  $(\u0027ring\u0027).setAttribute(\u0027r\u0027, 62 + (ringK \u003c 0 ? 0 : ringK * 70)); $(\u0027ring\u0027).setAttribute(\u0027opacity\u0027, ringK \u003c 0 ? 0 : 1 - ringK);\n  const lift = Math.max(0, BALL_Y - ballY) / (BALL_Y - HOLD_Y);                           // a sombra encolhe com a bola no ar\n  $(\u0027shadow\u0027).setAttribute(\u0027rx\u0027, 84 - 30 * lift);\n  if (!reduceMotion) raf = requestAnimationFrame(frame);\n}\ndrawClaw(REST, 0); setBall(BALL_Y);\nif (!reduceMotion) {\n  raf = requestAnimationFrame(frame);\n  document.addEventListener(\u0027visibilitychange\u0027, () =\u003e { if (!document.hidden) { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); } });   // retoma se a aba ficou escondida\n}\n\n/* fundo: colunas de código caindo, como na roleta */\n(function initRain() {\n  const snippets = [\n    \"if (link.suspicious) report();\", \"const mfa = true;\", \"hash(password, salt);\", \"while (alive) { scan(); }\",\n    \"lgpd.consent(user);\", \"firewall.allow(trusted);\", \"token.rotate();\", \"if (!verified) deny();\",\n    \"encrypt(data, key);\", \"audit.log(event);\", \"return \u0027threat_blocked\u0027;\", \"session.expire(15);\",\n    \"patch(vuln.cve);\", \"const zeroTrust = 1;\", \"phishing.detect(mail);\", \"vpn.connect();\",\n  ];\n  const rain = $(\u0027rain\u0027);\n  for (let c = 0; c \u003c 6; c++) {\n    const col = document.createElement(\u0027div\u0027);\n    col.className = \u0027rain\u0027;\n    col.style.left = (c * 17 + Math.random() * 6) + \u0027%\u0027;\n    col.style.animationDuration = (45 + Math.random() * 40) + \u0027s\u0027;\n    col.style.animationDelay = (-Math.random() * 60) + \u0027s\u0027;\n    col.textContent = shuffle(snippets).concat(shuffle(snippets)).join(\u0027\\n\u0027);\n    rain.appendChild(col);\n  }\n})();\n\n/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",
"\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"dark\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#002233\"\u003e\n\u003cmeta name=\"robots\" content=\"noindex,nofollow\"\u003e\n\u003ctitle\u003eProgramação · Chamada · Semana de Segurança e Privacidade\u003c/title\u003e\n\u003cstyle\u003e\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 300; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Light.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 400; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Regular.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 600; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-SemiBold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 700; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-Bold.ttf\u0027) format(\u0027truetype\u0027); }\n  @font-face { font-family: \u0027TOTVS\u0027; font-weight: 800; font-style: normal; font-display: swap; src: url(\u0027fonts/TOTVS-ExtraBold.ttf\u0027) format(\u0027truetype\u0027); }\n  :root {\n    /* paleta TOTVS */\n    --azul-escuro: #002233; --azul: #00DBFF; --roxo: #A44DFF; --rosa: #FF009E; --verde: #00FFD4; --limao: #D9FF65; --laranja: #FF8900; --branco: #FFFFFF;\n    --muted: rgba(255,255,255,.72); --line: rgba(164,77,255,.45); --panel: rgba(0,34,51,.92);\n    --fonte: \u0027TOTVS\u0027, Verdana, sans-serif;     /* TOTVS em todo o texto; Verdana só se a TOTVS não carregar */\n    --u: min(1vw, 1.65vh);                      /* unidade fluida: tudo se ajusta ao tamanho da tela, de notebook a TV 4K */\n  }\n  @media (max-aspect-ratio: 7/5) { :root { --u: min(1.7vw, 1.1vh); } }   /* telas \"em pé\": layout empilhado */\n  * { box-sizing: border-box; }\n  html, body { height: 100%; }\n  html { background: #002233; }\n  body { margin: 0; overflow: hidden; color: var(--branco); font: 400 calc(var(--u) * 1.5)/1.45 var(--fonte); user-select: none; -webkit-user-select: none; background: #002233; }\n  h1, p { margin: 0; }\n  h1 { font: 800 calc(var(--u) * 4.4)/1.05 var(--fonte); letter-spacing: -.02em; text-transform: uppercase; color: var(--roxo); filter: drop-shadow(0 0 18px rgba(164,77,255,.35)); }\n  .tag { font: 700 calc(var(--u) * 1.3)/1 var(--fonte); letter-spacing: .18em; text-transform: uppercase; color: var(--azul); }\n  .tag::before { content: \"// \"; color: var(--muted); }\n  .tag.eyebrow { color: var(--branco); }   /* \"Semana de Segurança e Privacidade\" em branco */\n\n  /* ---------- fundo: rede e código animados (o mesmo da roleta) ---------- */\n  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }\n  .floor { position: absolute; left: -50%; right: -50%; bottom: -2%; height: 46vh;\n    background: repeating-linear-gradient(90deg, rgba(164,77,255,.35) 0 max(1px, calc(var(--u) * .08)), transparent max(1px, calc(var(--u) * .08)) calc(var(--u) * 3.6)), repeating-linear-gradient(0deg, rgba(164,77,255,.35) 0 max(1px, calc(var(--u) * .08)), transparent max(1px, calc(var(--u) * .08)) calc(var(--u) * 2.7));\n    transform: perspective(calc(var(--u) * 23.6)) rotateX(62deg); transform-origin: 50% 100%;\n    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);\n    opacity: .42; animation: run 2.4s linear infinite; }\n  @keyframes run { to { background-position: 0 0, 0 calc(var(--u) * 2.7); } }\n  .rain { position: absolute; top: 0; font: calc(var(--u) * .62)/1.7 var(--fonte); color: var(--roxo); opacity: .06; white-space: pre; animation: fall linear infinite; }\n  @keyframes fall { from { transform: translateY(-60%); } to { transform: translateY(100vh); } }\n\n\n  /* ---------- palco: programação à esquerda, QR code em destaque à direita (pensado para TV de 70\": leitura a vários metros) ---------- */\n  #stage { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: center; gap: calc(var(--u) * 4);\n    padding: calc(var(--u) * 2) calc(var(--u) * 5) calc(var(--u) * 7.5); }\n  .side { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.6); }\n  /* título da semana em destaque (grande); \"Programação\" vira a etiqueta pequena logo abaixo */\n  h1 { font-size: calc(var(--u) * 3); line-height: 1.08; }\n  h1 span { white-space: nowrap; }\n  .sub { display: block; margin-top: calc(var(--u) * 1); font-size: calc(var(--u) * 1.6); }\n\n  /* um cartão por dia: data à esquerda, atividade à direita; a cor da barra identifica a atividade */\n  .days { display: grid; gap: calc(var(--u) * 1.1); margin: 0; padding: 0; list-style: none; }\n  .day { --c: var(--roxo); position: relative; display: grid; grid-template-columns: calc(var(--u) * 10) minmax(0, 1fr); align-items: center; gap: calc(var(--u) * 2.4);\n    padding: calc(var(--u) * 1.1) calc(var(--u) * 2); border: 1px solid var(--line); border-left: calc(var(--u) * .6) solid var(--c); border-radius: 4px; background: var(--panel); }\n  .day.roleta { --c: var(--roxo); } .day.garra { --c: var(--rosa); } .day.palestra { --c: var(--azul); border-color: rgba(0,219,255,.55); box-shadow: 0 0 40px rgba(0,219,255,.12); }\n  .date { display: grid; justify-items: start; gap: calc(var(--u) * .3); }\n  .wd { font: 700 calc(var(--u) * 1.3)/1 var(--fonte); letter-spacing: .18em; text-transform: uppercase; color: var(--c); }\n  .dm { font: 800 calc(var(--u) * 3.8)/1 var(--fonte); letter-spacing: -.02em; }\n  .act { min-width: 0; display: grid; gap: calc(var(--u) * .5); }\n  .name { font: 800 calc(var(--u) * 2.4)/1.1 var(--fonte); letter-spacing: -.01em; }\n  .name small { display: block; margin-top: calc(var(--u) * .3); font: 700 calc(var(--u) * 1.55)/1.2 var(--fonte); color: var(--azul); letter-spacing: 0; }\n  .desc { font-size: calc(var(--u) * 1.35); line-height: 1.35; color: var(--muted); }\n  .meta { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .4) calc(var(--u) * 2); font: 700 calc(var(--u) * 1.6)/1.2 var(--fonte); }\n  .meta span { display: inline-flex; align-items: center; gap: calc(var(--u) * .7); }\n  .meta svg { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); flex: none; color: var(--c); }\n  .go { color: var(--azul); }\n  /* \"Hoje\": marcado sozinho pela data do computador */\n  .today { display: none; margin-left: calc(var(--u) * .8); padding: calc(var(--u) * .25) calc(var(--u) * .7); border-radius: 3px; background: var(--limao); color: #002233; font: 800 calc(var(--u) * 1.05)/1 var(--fonte); letter-spacing: .12em; vertical-align: middle; animation: blink 1.4s ease-in-out infinite; }\n  .day.is-today .today { display: inline-block; }\n  .day.is-today { border-color: var(--limao); }\n  @keyframes blink { 50% { opacity: .45; } }\n\n  /* ---------- animações leves ---------- */\n  /* brilho que percorre o contorno de cada cartão, na cor da atividade (cada um num ritmo, para não andarem juntos) */\n  @property --a { syntax: \u0027\u003cangle\u003e\u0027; inherits: false; initial-value: 0deg; }\n  .day::after { content: \"\"; position: absolute; inset: -1px; border-radius: 4px; padding: max(2px, calc(var(--u) * .14)); pointer-events: none;\n    background: conic-gradient(from var(--a), transparent 0 70%, var(--c) 86%, #FFFFFF 88%, var(--c) 90%, transparent 100%);\n    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;\n    opacity: .9; animation: orbit 7s linear infinite; }\n  .day.garra::after { animation-duration: 8s; animation-delay: -3s; }\n  .day.palestra::after { animation-duration: 6s; animation-delay: -1.5s; }\n  @keyframes orbit { to { --a: 360deg; } }\n  /* entrada: quando a tela aparece na chamada, o título e os cartões entram um depois do outro */\n  .side \u003e div, .day, .qrside \u003e * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }\n  .day:nth-child(1) { animation-delay: .25s; } .day:nth-child(2) { animation-delay: .4s; } .day:nth-child(3) { animation-delay: .55s; }\n  .qrside \u003e :nth-child(2) { animation-delay: .2s; } .qrside \u003e :nth-child(3) { animation-delay: .35s; } .qrside \u003e :nth-child(4) { animation-delay: .45s; } .qrside \u003e :nth-child(5) { animation-delay: .55s; }\n  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 1.5)); } }\n  @keyframes linkpulse { 50% { box-shadow: 0 0 calc(var(--u) * 1.6) rgba(0,219,255,.55); } }\n\n  /* ---------- QR code: o destaque da tela; fundo branco (necessário para a leitura) dentro de cantoneiras neon ---------- */\n  .qrside { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.5); text-align: center; }\n  .qrhead { font: 800 calc(var(--u) * 3)/1.1 var(--fonte); letter-spacing: -.01em; }\n  .qrhead span { color: var(--azul); }\n  .qrframe { position: relative; padding: calc(var(--u) * 2);\n    width: min(100%, calc(100vh - var(--u) * 32), calc(100dvh - var(--u) * 32)); aspect-ratio: 1; }\n  /* cantoneiras numa camada própria: elas \"respiram\" (abrem e fecham de leve) e o QR code fica parado, para não atrapalhar a leitura */\n  .qrframe::before { --k: var(--azul); --s: calc(var(--u) * 4.5); --t: calc(var(--u) * .55); content: \"\"; position: absolute; inset: 0; pointer-events: none;\n    background:\n      linear-gradient(var(--k), var(--k)) top left / var(--s) var(--t) no-repeat, linear-gradient(var(--k), var(--k)) top left / var(--t) var(--s)  3 segundos parado (tela de exibição) */\n(function cursorAuto() {\n  let t = 0;\n  const hide = () =\u003e { document.body.style.cursor = \u0027none\u0027; };\n  const show = () =\u003e { document.body.style.cursor = \u0027\u0027; clearTimeout(t); t = setTimeout(hide, 3000); };\n  addEventListener(\u0027mousemove\u0027, show); show();\n})();\n\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"];
const SECONDS = Math.max(6, +new URLSearchParams(location.search).get('s') || 15);

const frames = PAGES.map(() => {
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  document.body.appendChild(f);
  return f;
});
let cur = -1;
function show(i) {
  const f = frames[i];
  let done = false;
  const go = () => {
    if (done) return; done = true;
    if (cur >= 0 && cur !== i) frames[cur].classList.remove('on');
    f.classList.add('on'); cur = i;
    setTimeout(() => show((i + 1) % PAGES.length), SECONDS * 1000);
  };
  f.onload = () => setTimeout(go, 300);
  setTimeout(go, 3000);                                            // se demorar a carregar, segue mesmo assim
  f.srcdoc = PAGES[i] + '<!-- ' + Date.now() + ' -->';             // recarrega o banner para a animação recomeçar do início
}
show(0);
/* o ponteiro do mouse aparece ao mexer e some depois de 3 segundos parado (tela de exibição) */
(function cursorAuto() {
  let t = 0;
  const hide = () => { document.body.style.cursor = 'none'; };
  const show = () => { document.body.style.cursor = ''; clearTimeout(t); t = setTimeout(hide, 3000); };

})();</script>
