<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#002233">
<meta name="robots" content="noindex,nofollow">
<title>Shield Spin · Cyber Shield Game</title>
<style>
  @font-face { font-family: 'TOTVS'; font-weight: 200; font-style: normal; font-display: swap; src: url('fonts/TOTVS-ExtraLight.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 300; font-style: normal; font-display: swap; src: url('fonts/TOTVS-Light.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/TOTVS-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 600; font-style: normal; font-display: swap; src: url('fonts/TOTVS-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 700; font-style: normal; font-display: swap; src: url('fonts/TOTVS-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 800; font-style: normal; font-display: swap; src: url('fonts/TOTVS-ExtraBold.ttf') format('truetype'); }
  :root {
    --bg0: #002233; --bg1: #002233;
    --panel: rgba(0,34,51,.92); --panel-2: rgba(255,255,255,.07);
    /* paleta do jogo: apenas estas cores, mais branco */
    --purple: #A44DFF; --pink: #FF009E; --cyan: #00DBFF; --mint: #00FFD4; --lime: #D9FF65; --orange: #FF8900;
    --line: rgba(164,77,255,.45); --text: #FFFFFF; --muted: rgba(255,255,255,.72);
    --ok: #00FFD4; --bad: #FF009E; --warn: #FF8900;
    --grad: linear-gradient(90deg, #A44DFF, #FF009E);   /* único gradiente do jogo */
    --label: 'TOTVS', Verdana, sans-serif;   /* rótulos, botões e números */
    --sans: Verdana, sans-serif;
    --display: 'TOTVS', Verdana, sans-serif;
    --u: min(1vw, 1.65vh);   /* unidade fluida: tudo se ajusta ao tamanho da tela, de notebook a TV 4K */
  }
  @media (max-aspect-ratio: 7/5) { :root { --u: min(1.7vw, 1.1vh); } }   /* telas mais "em pé": layout empilhado */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--text); font: calc(var(--u) * 1.5)/1.45 var(--sans);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    /* mesmo fundo do quiz */
    background:
      radial-gradient(calc(var(--u) * 61) calc(var(--u) * 31) at 50% -12%, rgba(164,77,255,.42), transparent 62%),
      radial-gradient(calc(var(--u) * 39) calc(var(--u) * 27) at 100% 100%, rgba(255,0,158,.16), transparent 60%),
      radial-gradient(calc(var(--u) * 33) calc(var(--u) * 23) at 0% 70%, rgba(164,77,255,.12), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    background-attachment: fixed;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  h1, h2 { margin: 0; font-family: var(--display); line-height: 1.05; letter-spacing: -.02em; }
  p { margin: 0 0 calc(var(--u) * 1); }
  .muted { color: var(--muted); }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(164,77,255,.35)); }
  .tag { font: 700 calc(var(--u) * 1.3)/1 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }
  .tag::before { content: "// "; color: var(--muted); }
  .tag.bad { color: var(--bad); } .tag.ok { color: var(--ok); }

  /* ---------- cenário ---------- */
  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floor { position: absolute; left: -50%; right: -50%; bottom: -2%; height: 46vh;
    background: repeating-linear-gradient(90deg, rgba(164,77,255,.35) 0 1px, transparent 1px 64px), repeating-linear-gradient(0deg, rgba(164,77,255,.35) 0 1px, transparent 1px 48px);
    transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);
    opacity: .42; animation: run 2.4s linear infinite; }
  @keyframes run { to { background-position: 0 0, 0 48px; } }
  .rain { position: absolute; top: 0; font: calc(var(--u) * .62)/1.7 var(--sans); color: var(--purple); opacity: .06; white-space: pre; animation: fall linear infinite; }
  @keyframes fall { from { transform: translateY(-60%); } to { transform: translateY(100vh); } }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,34,51,.45)); }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- palco ---------- */
  #stage { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 2) calc(var(--u) * 4) calc(var(--u) * 5.2); }
  .wheelbox { display: grid; place-items: center; min-height: 0; min-width: 0; }
  .wheelwrap { position: relative; width: min(100%, calc(100vh - var(--u) * 12), calc(100dvh - var(--u) * 12)); aspect-ratio: 1; filter: drop-shadow(0 0 40px rgba(164,77,255,.25)); }
  .wheelwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pointer { position: absolute; top: 0; left: 50%; width: 8%; aspect-ratio: 1; transform: translate(-50%, 2%); background: var(--lime);
    clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(0 0 10px var(--lime)); z-index: 2; }
  #rot { transform-origin: 0 0; will-change: transform; }
  .ss { fill: rgba(0,219,255,.24); } .sp { fill: rgba(217,255,101,.2); }
  .sg  { fill: url(#gGold); } .sd { fill: rgba(255,255,255,.14); }
  .legend { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1) calc(var(--u) * 2.4); margin-top: calc(var(--u) * 1.8); font: 700 calc(var(--u) * 1.35) var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: calc(var(--u) * .8); }
  .sw { display: inline-block; width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); border: 1px solid rgba(164,77,255,.6); border-radius: 3px; }
  .sw.ss { background: rgba(0,219,255,.24); } .sw.sp { background: rgba(217,255,101,.2); } .sw.sg { background: linear-gradient(180deg, #A44DFF, #FF009E); border-color: #FFFFFF; }
  .ls { font: 700 21px var(--display); fill: #FFFFFF; letter-spacing: .01em; }
  .lg { font: 800 20px var(--display); fill: #FFFFFF; letter-spacing: .05em; }
  .ld { font: 800 21px var(--display); fill: rgba(255,255,255,.6); letter-spacing: .06em; }

  .side { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 2.4); }
  #state { display: flex; flex-direction: column; gap: calc(var(--u) * 2.4); }
  #state > p, #state > div > p { margin: 0; }
  .side h1 { font-size: calc(var(--u) * 5.6); font-weight: 800; text-transform: uppercase; }
  .lead { font-size: calc(var(--u) * 1.9); line-height: 1.4; color: var(--text); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 1.2); font: 700 calc(var(--u) * 1.4) var(--label); color: var(--muted); }
  .steps b { color: var(--lime); margin-right: .6em; }
  .note { font: calc(var(--u) * 1.35) var(--label); color: var(--muted); letter-spacing: .04em; }

  .panel { --c: var(--purple); --s: calc(var(--u) * 1.4); --t: 2px; position: relative; padding: calc(var(--u) * 2); border: 1px solid var(--line); border-radius: 4px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top left / var(--t) var(--s) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) top right / var(--t) var(--s) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--s) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--s) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--s) no-repeat,
      var(--panel);
    box-shadow: 0 0 40px rgba(164,77,255,.07), inset 0 0 40px rgba(164,77,255,.04); }

  /* botão ajustado ao texto: largura automática, com respiro moderado nas laterais */
  .btn { display: inline-flex; align-items: center; justify-content: center; width: auto; min-width: calc(var(--u) * 14); padding: calc(var(--u) * 1.5) calc(var(--u) * 3.2); border-radius: 999px; border: 1px solid transparent;
    font: 800 calc(var(--u) * 1.6)/1 var(--label); letter-spacing: .14em; text-transform: uppercase; text-align: center; white-space: nowrap; transition: transform .15s, box-shadow .2s; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn.primary { color: #FFFFFF; background: var(--grad); box-shadow: 0 0 30px rgba(164,77,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.secondary { color: #FFFFFF; background: rgba(0,34,51,.4); border-color: var(--line); }
  .btn.danger { color: var(--bad); background: transparent; border-color: rgba(255,0,158,.5); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.pulse:not(:disabled) { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 52px rgba(255,0,158,.75), inset 0 1px 0 rgba(255,255,255,.35); } }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u) * 2); }
  /* grupos de botões: todos com a largura do maior, para não depender de alinhamento */
  .btns { display: inline-grid; grid-template-columns: 1fr; gap: calc(var(--u) * 1.4); }
  .btns.cols { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .btns.two { grid-template-columns: repeat(2, 1fr); }
  .btns .btn { width: 100%; }
  #state > .btn, #state > .row, #state > .btns, .idform > .btns { align-self: flex-start; }
  .modal .box > .btns { align-self: center; }
  .modal .box > .btn { align-self: center; }
  .modal .box > .row { justify-content: center; }
  .chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .8); margin: calc(var(--u) * 1.2) 0; }
  .chip { font: 700 calc(var(--u) * 1.4)/1 var(--label); letter-spacing: .08em; text-transform: uppercase; padding: calc(var(--u) * .9) calc(var(--u) * 1.2); border: 1px solid var(--line); background: var(--panel-2); color: var(--cyan); }
  .chip b { color: var(--lime); }
  .chip.lime { color: #002233; background: var(--lime); border-color: var(--lime); }

  /* ---------- identificação ---------- */
  .key { flex: 1; max-width: calc(var(--u) * 7.5); min-height: calc(var(--u) * 4.2); display: grid; place-items: center; font: 800 calc(var(--u) * 2) var(--label); text-transform: lowercase;
    color: var(--text); background: rgba(164,77,255,.08); border: 1px solid var(--line); border-radius: 6px; }
  .key:active { background: rgba(217,255,101,.3); border-color: var(--lime); }
  .key.wide { max-width: calc(var(--u) * 11); font-size: calc(var(--u) * 1.4); }
  .pad .key[data-n="x"], .pad .key[data-n="ok"] { font-size: calc(var(--u) * 1.5); }
  .it svg, .rv svg, .stats svg, .linkish svg { width: 1em; height: 1em; vertical-align: -.12em; }
  .err { color: var(--bad); font: calc(var(--u) * 1.3) var(--sans); min-height: 1.4em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * .8); }
  .stats div { padding: calc(var(--u) * 1) calc(var(--u) * .6); border: 1px solid var(--line); background: var(--panel-2); text-align: center; }
  .stats b { display: block; font: 800 calc(var(--u) * 2) var(--label); }
  .stats span { font: calc(var(--u) * 1.15) var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* ---------- popup ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: calc(var(--u) * 2); background: rgba(0,34,51,.84); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .25s both; }
  .modal[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  .modal .box { width: min(100%, calc(var(--u) * 88)); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 2); padding: calc(var(--u) * 2.8); animation: pop .35s cubic-bezier(.2,.9,.3,1.2) both; }
  .modal .box > * { margin: 0; flex: none; }
  .modal .box > .btn { margin-top: calc(var(--u) * .8); }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .box h2 { font-size: calc(var(--u) * 3.8); font-weight: 800; margin: calc(var(--u) * .6) 0 calc(var(--u) * 1); }
  .story { font-size: calc(var(--u) * 1.9); line-height: 1.45; }
  .lesson { margin: calc(var(--u) * 1.4) 0; padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); background: rgba(217,255,101,.09); border-left: 4px solid var(--lime); font: 700 calc(var(--u) * 1.9)/1.35 var(--display); }
  .lesson span { display: block; margin-bottom: calc(var(--u) * .5); font: 800 calc(var(--u) * 1.2) var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--lime); }
  .qbox { padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5); background: rgba(0,219,255,.08); border-left: 4px solid var(--cyan); font: 700 calc(var(--u) * 1.7)/1.35 var(--display); }
  .qbox span { display: block; margin-bottom: calc(var(--u) * .5); font: 800 calc(var(--u) * 1.2) var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
  .box.tight .qbox { font-size: calc(var(--u) * 1.6); }
  .stats.two { grid-template-columns: repeat(2, 1fr); }
  .code { margin: calc(var(--u) * 1.2) 0; padding: calc(var(--u) * 1.4); text-align: center; border: 2px dashed var(--lime); color: var(--lime); font: 800 calc(var(--u) * 5) var(--label); letter-spacing: .3em; text-shadow: 0 0 20px rgba(217,255,101,.5); }
  .prizeh { color: var(--lime); text-shadow: 0 0 30px rgba(217,255,101,.45); }
  .linkish { background: none; border: 0; padding: calc(var(--u) * 1); color: var(--muted); font: calc(var(--u) * 1.25) var(--label); letter-spacing: .12em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- desafio ---------- */
  .opts { display: grid; gap: calc(var(--u) * 1.3); margin: 0; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .it { display: flex; align-items: center; gap: calc(var(--u) * 1.2); width: 100%; text-align: left; padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4); font-size: calc(var(--u) * 1.6); line-height: 1.3;
    background: rgba(0,34,51,.3); border: 2px solid var(--line); border-radius: 4px; }
  .it .n { flex: none; width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); display: grid; place-items: center; font: 800 calc(var(--u) * 1.6) var(--label); border: 1px solid var(--line); color: var(--cyan); }
  .it.sel { border-color: var(--lime); background: rgba(217,255,101,.12); box-shadow: 0 0 22px rgba(217,255,101,.2); }
  .it.sel .n { background: var(--lime); color: #002233; border-color: var(--lime); }
  .jbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); background: rgba(0,34,51,.3); border: 1px solid var(--line); }
  .jbox p { margin: 0; font-size: calc(var(--u) * 1.6); }
  .jbox .row { gap: calc(var(--u) * 1); }
  .jbox .row .it { white-space: nowrap; }
  .jbox .row .it { width: auto; justify-content: center; font: 800 calc(var(--u) * 1.4) var(--label); letter-spacing: .08em; text-transform: uppercase; padding: calc(var(--u) * 1.1) calc(var(--u) * 1.6); }
  .box.tight { gap: calc(var(--u) * 1.5); padding: calc(var(--u) * 2.4); }
  .box.tight h2 { font-size: calc(var(--u) * 3.2); }
  .box.tight .story { font-size: calc(var(--u) * 1.6); }
  .box.tight .opts { gap: calc(var(--u) * 1); }
  .box.tight .it { padding: calc(var(--u) * 1) calc(var(--u) * 1.3); }
  .rv { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .9); margin: 0; font-size: calc(var(--u) * 1.35); }
  .rv div:only-child { grid-column: 1 / -1; }
  .rv div { padding: calc(var(--u) * .8) calc(var(--u) * 1.2); border-left: 4px solid var(--ok); background: rgba(0,255,212,.07); }
  #done, #confirm { position: sticky; bottom: 0; box-shadow: 0 calc(var(--u) * 1.2) 0 calc(var(--u) * .4) var(--panel); }
  .rv div.no { border-left-color: var(--bad); background: rgba(255,0,158,.08); }
  .rv small { display: block; color: var(--muted); font-size: calc(var(--u) * 1.25); }

  /* ---------- admin / pin ---------- */
  #pin { z-index: 40; }
  .pinbox { width: min(100%, calc(var(--u) * 34)); text-align: center; }
  .dots { font: 800 calc(var(--u) * 3) var(--label); letter-spacing: .4em; min-height: 1.4em; color: var(--lime); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * .8); margin: calc(var(--u) * 1.2) 0; }
  .pad .key { max-width: none; min-height: calc(var(--u) * 5.6); }
  table { border-collapse: collapse; width: 100%; font: calc(var(--u) * 1.4) var(--sans); }
  th, td { text-align: left; padding: calc(var(--u) * .6) calc(var(--u) * .8); border-bottom: 1px solid rgba(164,77,255,.12); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  /* página da organização */
  #stage[hidden], #org[hidden] { display: none; }
  #org { position: fixed; inset: 0; z-index: 10; overflow-y: auto; padding: calc(var(--u) * 3) calc(var(--u) * 5) calc(var(--u) * 6); }
  .org-wrap { max-width: calc(var(--u) * 104); margin: 0 auto; display: flex; flex-direction: column; gap: calc(var(--u) * 2.4); }
  .org-wrap .panel { margin: 0; }
  .org-head { display: flex; justify-content: space-between; align-items: flex-end; gap: calc(var(--u) * 2); flex-wrap: wrap; }
  .org-head h1 { font-size: calc(var(--u) * 4.4); font-weight: 800; text-transform: uppercase; margin-top: calc(var(--u) * .8); }
  .org-head .btn { margin-top: 0; }
  .org-grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 2.4); }
  .stockcard { display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); }
  .stockcard .note { margin: 0; }
  .bignum { font: 800 calc(var(--u) * 7) var(--display); line-height: 1; color: var(--lime); font-variant-numeric: tabular-nums; }
  .adjust { display: flex; gap: calc(var(--u) * 1); flex-wrap: wrap; }
  .adjust .key { flex: none; min-width: calc(var(--u) * 7); max-width: none; font-size: calc(var(--u) * 1.6); }
  .stats.wide { grid-template-columns: repeat(4, 1fr); }
  .stats.wide div { padding: calc(var(--u) * 1.2) calc(var(--u) * .6); }
  .hot { position: fixed; left: 0; bottom: 0; width: calc(var(--u) * 8); height: calc(var(--u) * 8); z-index: 25; }

  #testbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; padding: 6px 12px;
    font: 700 calc(var(--u) * 1.3)/1.3 var(--label); letter-spacing: .08em; text-transform: uppercase; color: #002233; background: var(--warn); }
  #testbar[hidden] { display: none; }
  #testbar button { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  /* telas mais "em pé" (tablet, celular): roda em cima, painel embaixo */
  @media (max-aspect-ratio: 7/5) {
    #stage { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: start; justify-items: center; overflow-y: auto; gap: calc(var(--u) * 3); padding: calc(var(--u) * 6) calc(var(--u) * 3) calc(var(--u) * 9); }
    .wheelwrap { width: min(100%, 46vh, 46dvh); }
    .side { width: 100%; }
    .side h1 { font-size: calc(var(--u) * 4.6); }
    .org-grid, .btns.two { grid-template-columns: 1fr; }
    .stats.wide { grid-template-columns: repeat(2, 1fr); }
    #org { padding: calc(var(--u) * 3) calc(var(--u) * 3) calc(var(--u) * 6); }
    .opts.two { grid-template-columns: 1fr; }
    .jbox { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="floor"></div><div id="rain"></div><div class="vignette"></div></div>
<div id="testbar" hidden></div>

   ============================================================ */

const XIC = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const hhmm = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const csvCell = v => { let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* total: null = a organização ainda não informou; used = baixas de estoque */
const freshDb = () => ({ log: [], total: { souvenirs: null, prizes: null }, used: { souvenirs: 0, prizes: 0 } });
function readDb() {
  try { const d = JSON.parse(localStorage.getItem(CONFIG.storageKey)); if (d && Array.isArray(d.log) && d.total && d.used) return d; } catch { /* sem dados */ }
  return freshDb();
}
let db = readDb();
const save = () => { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(db)); } catch { /* armazenamento indisponível */ } };
if (TEST && db.total.souvenirs === null && db.total.prizes === null) { db.total = { ...TEST_STOCK }; save(); }
const configured = () => db.total.souvenirs !== null && db.total.prizes !== null;
const left = k => Math.max(0, (db.total[k] === null ? 0 : db.total[k]) - db.used[k]);
function newCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code;
  do { code = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); } while (db.log.some(l => l.code === code));
  return code;
}
function giveSouvenir() {
  if (left('souvenirs') <= 0) return 'none';
  db.used.souvenirs++;
  return 'given';
}
const challengesLastHour = () => db.log.filter(l => l.type === 'spin' && l.kind === 'challenge' && l.at > Date.now() - 3600000).length;

/* ============================================================
   ESTADO E RODA
   ============================================================ */
let ui = { mode: 'attract', challenge: null, quiz: null };
let rot = 0, idleRaf = 0, idleT = 0, forceGold = false, orgOk = false;
const R = 290;
const pt = (deg, r) => { const a = deg * Math.PI / 180; return [(r * Math.sin(a)).toFixed(2), (-r * Math.cos(a)).toFixed(2)]; };

function drawWheel() {
  const out = configured() && left('prizes') <= 0;
  $('slices').innerHTML = SLICES.map((s, i) => {
    const c = i * 30, [x1, y1] = pt(c - 15, R), [x2, y2] = pt(c + 15, R);
    const cls = s.gold ? (out ? 'sd' : 'sg') : (s.kind === 'p' ? 'sp' : 'ss');
    const tcls = s.gold ? (out ? 'ld' : 'lg') : 'ls';
    return `<g><path class="${cls}" d="M0 0 L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z" stroke="rgba(164,77,255,.55)" stroke-width="2"/>
      <text class="${tcls}" transform="rotate(${c - 90}) translate(${R - 20},0)" text-anchor="end" dominant-baseline="central">${esc(s.gold && out ? 'ENCERRADO' : s.label)}</text></g>`;
  }).join('');
}
function setRot(deg, ms) {
  const g = $('rot');
  g.style.transition = ms ? `transform ${ms}ms cubic-bezier(.12,.6,.1,1)` : 'none';
  g.style.transform = `rotate(${deg}deg)`;
}
function idleSpin() {
  cancelAnimationFrame(idleRaf);
  if (reduceMotion) return;
  const step = () => { if (ui.mode !== 'attract') return; rot += .06; setRot(rot, 0); idleRaf = requestAnimationFrame(step); };
  idleRaf = requestAnimationFrame(step);
}

/* Sorteio da fatia: Proteção Total só cai enquanto houver prêmio em estoque (e dentro do limite por hora, se houver). */
function pickSlice() {
  const goldOk = left('prizes') > 0 && (!CONFIG.maxChallengesPerHour || challengesLastHour() < CONFIG.maxChallengesPerHour);
  const idxs = SLICES.map((_, i) => i).filter(i => !SLICES[i].gold || goldOk);
  if (TEST && forceGold && goldOk) { forceGold = false; renderTestBar(); return pick(idxs.filter(i => SLICES[i].gold)); }
  return pick(idxs);
}

function startSpin() {
  if (ui.mode !== 'attract' || !configured()) return;
  ui.mode = 'spin'; clearTimeout(idleT);
  const idx = pickSlice(), gold = !!SLICES[idx].gold;
  db.log.push({ at: Date.now(), type: 'spin', slice: SLICES[idx].id, kind: gold ? 'challenge' : SLICES[idx].kind });
  if (gold && CONFIG.prizeStockUsedOn === 'landing') db.used.prizes++;      // reserva o prêmio para este desafio
  save();
  $('state').innerHTML = `<p class="lead">Girando…</p><p class="note">&gt; descobrindo o que o destino reservou</p>`;
  cancelAnimationFrame(idleRaf);
  const ms = reduceMotion ? 1200 : CONFIG.spinSeconds * 1000;
  const target = Math.ceil(rot / 360) * 360 + 360 * (5 + Math.floor(Math.random() * 2)) - idx * 30 + (Math.random() - .5) * 18;
  setRot(rot, 0); void $('rot').getBoundingClientRect();
  setRot(target, ms);
  setTimeout(() => { rot = target % 360; setRot(rot, 0); settle(idx); }, ms + 300);
}

function settle(idx) {
  const s = SLICES[idx];
  drawWheel();
  if (s.gold) return startChallenge();
  startSceneQuiz(s);
}

/* ============================================================
   QUIZ DA SITUAÇÃO (segurança ou privacidade): acertou = brinde; errou = sem brinde
   ============================================================ */
function startSceneQuiz(s) {
  const base = pick(SCENE_QUIZ[s.id]);
  const qz = ui.quiz = { slice: s, q: base.q, opts: shuffle([{ t: base.correct, ok: true }, ...base.wrong.map(t => ({ t, ok: false }))]), sel: null };
  openModal(`<div class="box tight panel">
    <div class="tag bad">Alerta de ${s.kind === 'p' ? 'privacidade' : 'segurança'}</div>
    <h2><span class="grad">${esc(s.scene.title)}</span></h2>
    <p class="story">${esc(s.scene.story)}</p>
    <div class="qbox"><span>Quiz da situação · acerte e leve um brinde</span>${esc(qz.q)}</div>
    <div class="opts two">${qz.opts.map((o, i) => `<button class="it" type="button" data-i="${i}"><span class="n">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <button class="btn primary" id="confirm" type="button" disabled>Confirmar</button></div>`);
  const box = $('modal'), confirm = $('confirm');
  box.querySelectorAll('.it').forEach(b => b.onclick = () => {
    qz.sel = +b.dataset.i;
    box.querySelectorAll('.it').forEach(x => x.classList.toggle('sel', +x.dataset.i === qz.sel));
    confirm.disabled = false; bumpIdle();
  });
  confirm.onclick = () => { if (qz.sel !== null) answerSceneQuiz(); };
  ui.mode = 'modal'; bumpIdle();
}
function answerSceneQuiz() {
  const qz = ui.quiz; ui.quiz = null;
  const right = qz.opts[qz.sel].ok, s = qz.slice;
  const souv = right ? giveSouvenir() : '';
  const last = db.log[db.log.length - 1];
  if (last && last.type === 'spin') { last.quiz = right ? 'pass' : 'fail'; last.souvenir = souv; }
  save(); drawWheel();
  const lesson = `<div class="lesson"><span>Para não repetir</span>${esc(s.scene.lesson)}</div>`;
  if (right) {
    const brinde = souv === 'given' ? ['lime', 'Retire seu brinde com a equipe'] : ['', 'Brindes esgotados'];
    openModal(`<div class="box panel">
      <div class="tag ok">Resposta certa</div>
      <h2><span class="grad">Boa! Você sabe se proteger</span></h2>
      ${lesson}
      <div class="chips"><span class="chip ${brinde[0]}">${brinde[1]}</span></div>
      <button class="btn primary" id="done" type="button">Concluir</button></div>`);
  } else {
    const correct = qz.opts.find(o => o.ok).t;
    openModal(`<div class="box panel">
      <div class="tag bad">Resposta errada</div>
      <h2><span class="grad">Não foi dessa vez</span></h2>
      <p class="story">A resposta certa era: <b>${esc(correct)}</b></p>
      ${lesson}
      <div class="chips"><span class="chip">Sem brinde desta vez</span></div>
      <button class="btn primary" id="done" type="button">Concluir</button></div>`);
  }
  $('done').onclick = showAttract;
  ui.mode = 'modal'; bumpIdle();
}
/* Quiz abandonado (ninguém tocou): sem brinde e sem baixa de estoque. */
function abandonQuiz() {
  ui.quiz = null;
  const last = db.log[db.log.length - 1];
  if (last && last.type === 'spin' && !last.quiz) { last.quiz = 'abandon'; last.souvenir = ''; save(); }
}

/* ============================================================
   PROTEÇÃO TOTAL
   ============================================================ */
function makeChallenge() {
  const kind = pick(['spot', 'order', 'judge']);
  if (kind === 'spot') { const v = pick(SPOT); return { kind, title: v.title, intro: v.intro, items: shuffle(v.items), sel: new Set() }; }
  if (kind === 'order') { const v = pick(ORDER); return { kind, title: v.title, intro: v.intro, mono: !!v.mono, pw: v.pw, why: v.why, shown: shuffle(v.pw), chosen: [] }; }
  // 3 situações: ao menos uma de segurança, uma de privacidade, e nem todas iguais (risco x tudo certo)
  let items;
  do {
    const s = shuffle(JUDGE.filter(j => j.kind === 's')), p = shuffle(JUDGE.filter(j => j.kind === 'p'));
    items = shuffle([s[0], p[0], pick([...s.slice(1), ...p.slice(1)])]);
  } while (new Set(items.map(j => j.risk)).size < 2);
  return { kind, title: 'Risco ou tudo certo?', intro: 'Classifique cada situação.', items, ans: [] };
}
function startChallenge() {
  const ch = ui.challenge = makeChallenge();
  const body = {
    spot: () => `<div class="opts two">${ch.items.map((it, i) => `<button class="it" type="button" data-i="${i}"><span class="n">+</span><span>${esc(it.t)}</span></button>`).join('')}</div>`,
    order: () => `<div class="opts two">${ch.shown.map((pw, i) => `<button class="it" type="button" data-i="${i}"><span class="n">&nbsp;</span><span${ch.mono ? ' style="font-family:var(--sans)"' : ''}>${esc(pw)}</span></button>`).join('')}</div>
      <button class="linkish" id="redo" type="button">Refazer a ordem</button>`,
    judge: () => ch.items.map((it, i) => `<div class="jbox"><p>${esc(it.t)}</p><div class="row"><button class="it" type="button" data-i="${i}" data-v="1">Risco</button><button class="it" type="button" data-i="${i}" data-v="0">Tudo certo</button></div></div>`).join(''),
  }[ch.kind]();
  openModal(`<div class="box tight panel">
    <div class="tag">Proteção Total</div>
    <h2><span class="grad">${esc(ch.title)}</span></h2>
    <p class="story">${esc(ch.intro)} Acerte os 3 e ganhe um prêmio!</p>
    ${body}
    <button class="btn primary" id="confirm" type="button" disabled>Confirmar</button></div>`);
  const confirm = $('confirm'), box = $('modal');
  const update = () => {
    if (ch.kind === 'spot') {
      box.querySelectorAll('.it').forEach((b, i) => { const on = ch.sel.has(i); b.classList.toggle('sel', on); b.querySelector('.n').innerHTML = on ? CHK : '+'; });
      confirm.disabled = ch.sel.size === 0;
    } else if (ch.kind === 'order') {
      box.querySelectorAll('.it').forEach((b, i) => { const k = ch.chosen.indexOf(i); b.classList.toggle('sel', k >= 0); b.querySelector('.n').textContent = k >= 0 ? k + 1 : ' '; });
      confirm.disabled = ch.chosen.length < 4;
    } else {
      box.querySelectorAll('.it').forEach(b => b.classList.toggle('sel', ch.ans[+b.dataset.i] === +b.dataset.v));
      confirm.disabled = ch.ans.filter(a => a !== undefined).length < 3;
    }
  };
  box.querySelectorAll('.it').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (ch.kind === 'spot') { ch.sel.has(i) ? ch.sel.delete(i) : ch.sel.add(i); }
    else if (ch.kind === 'order') { if (!ch.chosen.includes(i)) ch.chosen.push(i); }
    else ch.ans[i] = +b.dataset.v;
    update(); bumpIdle();
  });
  if ($('redo')) $('redo').onclick = () => { ch.chosen = []; update(); };
  confirm.onclick = () => finishChallenge(evaluate(ch));
  ui.mode = 'modal'; bumpIdle();
}
/* Cada desafio devolve score 0..3 e o gabarito. */
function evaluate(ch) {
  if (ch.kind === 'spot') {
    const found = ch.items.filter((it, i) => it.bad && ch.sel.has(i)).length;
    const fp = ch.items.filter((it, i) => !it.bad && ch.sel.has(i)).length;
    const review = ch.items.map((it, i) => it.bad ? { ok: ch.sel.has(i), t: it.t, why: it.why } : (ch.sel.has(i) ? { ok: false, t: it.t, why: 'Isso é normal, não é um sinal de golpe.' } : null)).filter(Boolean);
    return { score: Math.max(0, found - fp), review };
  }
  if (ch.kind === 'order') {
    const rank = ch.chosen.map(i => ch.pw.indexOf(ch.shown[i]));
    let score = 0; for (let k = 0; k < 3; k++) if (rank[k] < rank[k + 1]) score++;
    return { score, review: [{ ok: score === 3, t: 'Ordem certa: ' + ch.pw.join('  →  '), why: ch.why }] };
  }
  const review = ch.items.map((it, i) => ({ ok: ch.ans[i] === (it.risk ? 1 : 0), t: (it.risk ? 'Risco: ' : 'Tudo certo: ') + it.t, why: it.why }));
  return { score: review.filter(r => r.ok).length, review };
}
function finishChallenge(res) {
  const ch = ui.challenge; ui.challenge = null;
  const landing = CONFIG.prizeStockUsedOn === 'landing';
  let won = res.score === 3, code = '', souv = '';
  if (won && !landing) { if (left('prizes') > 0) db.used.prizes++; else won = false; }
  if (won) { code = newCode(); db.log.push({ at: Date.now(), type: 'prize', code, delivered: false }); }
  else souv = giveSouvenir();                      // consolo: quem não conquista o prêmio leva um brinde
  db.log.push({ at: Date.now(), type: 'challenge', format: ch ? ch.kind : '', score: res.score, result: won ? 'pass' : 'fail', souvenir: souv, returned: false });
  save(); drawWheel();
  const review = res.review ? `<div class="rv">${res.review.map(r => `<div class="${r.ok ? '' : 'no'}">${r.ok ? CHK : XIC} ${esc(r.t)}<small>${esc(r.why)}</small></div>`).join('')}</div>` : '';
  if (won) {
    openModal(`<div class="box panel" style="--c:var(--lime)">
      <div class="tag ok">Proteção Total concluída</div>
      <h2 class="prizeh">Você ganhou um prêmio!</h2>
      <p class="story">Mostre esta tela à equipe para retirar.</p>
      <div class="code">${esc(code)}</div>
      <button class="btn primary" id="done" type="button">Concluir</button>
      <div style="text-align:center"><button class="linkish" id="staff" type="button">Equipe: confirmar entrega</button></div></div>`);
    $('staff').onclick = () => askPin(() => {
      const l = db.log.find(x => x.code === code); if (l) { l.delivered = true; save(); }
      $('staff').innerHTML = 'Entrega registrada ' + CHK; $('staff').disabled = true;
    });
  } else {
    const brinde = souv === 'given' ? ['lime', 'Retire seu brinde com a equipe'] : ['', 'Brindes esgotados'];
    openModal(`<div class="box tight panel">
      <div class="tag bad">Proteção Total</div>
      <h2><span class="grad">${res.score === 3 ? 'Perfeito, mas os prêmios acabaram' : 'Quase!'}</span></h2>
      <p class="story">Você acertou ${res.score} de 3. Veja o gabarito:</p>${review}
      <div class="chips"><span class="chip ${brinde[0]}">${brinde[1]}</span></div>
      <button class="btn primary" id="done" type="button">Concluir</button></div>`);
  }
  $('done').onclick = showAttract;
  ui.mode = 'modal'; bumpIdle();
}
/* Desafio abandonado (ninguém tocou): não gera brinde nem prêmio, e o prêmio reservado volta ao estoque. */
function abandonChallenge() {
  const ch = ui.challenge; ui.challenge = null;
  if (CONFIG.prizeStockUsedOn === 'landing') db.used.prizes = Math.max(0, db.used.prizes - 1);
  db.log.push({ at: Date.now(), type: 'challenge', format: ch ? ch.kind : '', score: 0, result: 'abandon', souvenir: '', returned: true });
  save(); drawWheel();
}

/* ============================================================
   TELA PRINCIPAL
   ============================================================ */
function showAttract() {
  clearTimeout(idleT); closeModal();
  ui = { mode: 'attract', challenge: null, quiz: null };
  if (!configured()) {
    $('state').innerHTML = `
      <p class="lead">A roleta ainda não foi iniciada.</p>
      <p class="note">&gt; A organização precisa informar o total de brindes e de prêmios para liberar o jogo.</p>
      <button class="btn primary" id="go" type="button" disabled>Girar</button>`;
  } else {
    $('state').innerHTML = `
      <p class="lead">Gire a roda, enfrente uma situação de segurança ou de privacidade e responda ao quiz para levar um brinde.</p>
      <ul class="steps"><li><b>1</b>Toque em Girar</li><li><b>2</b>Conheça a situação e responda ao quiz</li><li><b>3</b>Acertou? Retire seu brinde com a equipe</li></ul>
      <p class="note">&gt; Caiu na fatia PROTEÇÃO TOTAL? Passe no desafio e você ganha um prêmio!</p>
      <button class="btn primary pulse" id="go" type="button">Girar</button>`;
    $('go').onclick = startSpin;
  }
  idleSpin();
}

/* ============================================================
   POPUPS, INATIVIDADE E TECLADO NUMÉRICO (PIN e quantidades)
   ============================================================ */
function openModal(html) { const m = $('modal'); m.innerHTML = html; m.hidden = false; const b = m.querySelector('.box'); if (b) b.scrollTop = 0; }
function closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }

function bumpIdle() {
  clearTimeout(idleT);
  if (ui.mode === 'attract' || ui.mode === 'spin' || !$('pin').hidden || !$('org').hidden) return;
  idleT = setTimeout(endSession, ((ui.challenge || ui.quiz) ? CONFIG.idleChallengeSeconds : CONFIG.idleSeconds) * 1000);
}
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, bumpIdle, true));
function endSession() {
  if (ui.challenge) abandonChallenge();
  if (ui.quiz) abandonQuiz();
  showAttract();
}

/* teclado numérico na tela: opts = { tag, label, mask, initial, max }; onSubmit(valor, falhar) devolve true para fechar */
function keypad(opts, onSubmit, onCancel) {
  const m = $('pin'); let v = opts.initial || '';
  m.hidden = false; clearTimeout(idleT);
  const close = () => { m.hidden = true; m.innerHTML = ''; bumpIdle(); };
  const paint = () => {
    m.innerHTML = `<div class="box panel pinbox"><div class="tag">${esc(opts.tag)}</div><p class="lead">${esc(opts.label)}</p><div class="dots">${opts.mask ? '●'.repeat(v.length) : esc(v)}${v ? '' : '&nbsp;'}</div><div class="err" id="perr"></div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" type="button" data-n="${n}">${n}</button>`).join('')}<button class="key" type="button" data-n="x">apagar</button><button class="key" type="button" data-n="0">0</button><button class="key" type="button" data-n="ok">OK</button></div>
      <button class="linkish" id="pc" type="button">Cancelar</button></div>`;
    m.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      if (n === 'x') v = v.slice(0, -1);
      else if (n === 'ok') {
        const fail = msg => { v = ''; paint(); $('perr').textContent = msg; };
        if (onSubmit(v, fail) === true) close();
        return;
      }
      else if (v.length < (opts.max || 8)) v += n;
      paint();
    });
    $('pc').onclick = () => { close(); if (onCancel) onCancel(); };
  };
  paint();
}
function askPin(onOk, onCancel) {
  keypad({ tag: 'Organização', label: 'Digite o PIN', mask: true }, (v, fail) => {
    if (v === CONFIG.adminPin) { onOk(); return true; }
    fail('> PIN incorreto'); return false;
  }, onCancel);
}
function askNumber(label, initial, onOk) {
  keypad({ tag: 'Organização', label, mask: false, initial: initial === null ? '' : String(initial), max: 5 }, (v, fail) => {
    if (v === '') { fail('> informe um número'); return false; }
    onOk(+v); return true;
  });
}

/* ============================================================
   PÁGINA DA ORGANIZAÇÃO (roleta.html#organizacao, protegida pelo PIN)
   ============================================================ */
function summary() {
  const L = db.log, spins = L.filter(l => l.type === 'spin'), ch = L.filter(l => l.type === 'challenge'), prizes = L.filter(l => l.type === 'prize');
  return {
    spins: spins.length,
    sec: spins.filter(l => l.kind === 's').length, priv: spins.filter(l => l.kind === 'p').length, chal: spins.filter(l => l.kind === 'challenge').length,
    quizPass: spins.filter(l => l.quiz === 'pass').length, quizFail: spins.filter(l => l.quiz === 'fail').length,
    pass: ch.filter(c => c.result === 'pass').length, fail: ch.filter(c => c.result === 'fail').length,
    abandon: ch.filter(c => c.result === 'abandon').length + spins.filter(l => l.quiz === 'abandon').length,
    souvDelivered: spins.filter(l => l.souvenir === 'given').length + ch.filter(c => c.souvenir === 'given').length,
    prizesDelivered: prizes.filter(p => p.delivered).length, prizesPending: prizes.filter(p => !p.delivered),
    toReturn: ch.filter(c => c.result === 'fail' && !c.returned).length,
  };
}
const sliceById = id => SLICES.find(s => s.id === id);
/* uma linha de histórico, legível: [tipo, detalhe, resultado, código, entregue] */
function describe(l) {
  if (l.type === 'spin') {
    const s = sliceById(l.slice);
    if (l.kind === 'challenge') return ['Giro', 'Proteção Total', '', '', ''];
    const res = { pass: 'acertou o quiz · ' + (l.souvenir === 'given' ? 'brinde entregue' : 'brindes esgotados'), fail: 'errou o quiz · sem brinde', abandon: 'abandonado' }[l.quiz] || '';
    return ['Giro', `${s ? s.label : l.slice} (${l.kind === 'p' ? 'privacidade' : 'segurança'})`, res, '', ''];
  }
  if (l.type === 'challenge') return ['Desafio', `${l.format} · ${l.score}/3`, { pass: 'aprovado', fail: 'reprovado', abandon: 'abandonado' }[l.result] + (l.souvenir === 'given' ? ' · brinde entregue' : ''), '', ''];
  if (l.type === 'prize') return ['Prêmio', 'voucher gerado', '', l.code, l.delivered ? 'sim' : 'não'];
  return ['Estoque', `total de ${l.what === 'souvenirs' ? 'brindes' : 'prêmios'}: ${l.from === null ? 'não informado' : l.from} → ${l.to}`, '', '', ''];
}
function download(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/* A organização informa (ou altera) o TOTAL; as baixas continuam contadas e o restante é total − baixas. */
function setTotal(what, n) {
  const from = db.total[what];
  db.total[what] = Math.max(0, Math.round(n));
  db.log.push({ at: Date.now(), type: 'adjust', what, from, to: db.total[what] });
  save(); drawWheel();
}
function resetGame() {      // zera as baixas, o total informado e o histórico
  db = freshDb(); save(); drawWheel();
}
function renderOrg() {
  const S = summary();
  const card = (k, label, extra) => `<section class="panel stockcard">
      <div class="tag">${label}</div><div class="bignum">${db.total[k] === null ? '—' : left(k)}</div>
      <p class="note">${db.total[k] === null ? 'total ainda não informado' : 'restantes'}${extra || ''}</p>
      <div class="stats two"><div><b>${db.total[k] === null ? '—' : db.total[k]}</b><span>total informado</span></div><div><b>${db.used[k]}</b><span>baixas</span></div></div>
      <div class="adjust"><button class="btn secondary" data-set="${k}" type="button">${db.total[k] === null ? 'Informar total' : 'Alterar total'}</button>
        ${db.total[k] === null ? '' : [-10, -1, 1, 10].map(d => `<button class="key" data-s="${k}" data-d="${d}" type="button">${d > 0 ? '+' : '−'}${Math.abs(d)}</button>`).join('')}</div></section>`;
  const tile = (n, label) => `<div><b>${n}</b><span>${label}</span></div>`;
  const recent = db.log.slice(-15).reverse().map(l => { const d = describe(l); return `<tr><td>${hhmm(l.at)}</td><td>${esc(d[0])}</td><td>${esc(d[1])}</td><td>${esc(d[2] || (d[3] ? 'código ' + d[3] : ''))}</td></tr>`; }).join('');
  $('org').innerHTML = `<div class="org-wrap">
    <div class="org-head">
      <div><div class="tag">Organização</div><h1><span class="grad">Painel da roleta</span></h1></div>
      <button class="btn secondary" id="back" type="button">Voltar à roleta</button>
    </div>
    ${configured() ? '' : `<section class="panel" style="--c:var(--orange)"><div class="tag bad">Estoque não informado</div>
      <p class="story" style="margin:12px 0 0">Informe o total de brindes e de prêmios para liberar a roleta. O total informado vale até alguém da organização alterá-lo.</p></section>`}
    <div class="org-grid">${card('souvenirs', 'Brindes')}${card('prizes', 'Prêmios', ' · o estoque de prêmios limita quantas vezes a roda cai em Proteção Total')}</div>
    <section class="panel"><div class="tag">Resumo</div>
      <div class="stats wide" style="margin-top:12px">${tile(S.spins, 'giros')}${tile(S.sec, 'segurança')}${tile(S.priv, 'privacidade')}${tile(S.chal, 'proteção total')}
        ${tile(S.quizPass, 'quiz: acertos')}${tile(S.quizFail, 'quiz: erros')}${tile(S.pass, 'desafio: aprovados')}${tile(S.fail, 'desafio: reprovados')}
        ${tile(S.abandon, 'abandonados')}${tile(S.souvDelivered, 'brindes entregues')}${tile(S.prizesDelivered, 'prêmios entregues')}${tile(S.prizesPending.length, 'prêmios pendentes')}</div></section>
    <section class="panel"><div class="tag">Prêmios pendentes de entrega</div>
      ${S.prizesPending.length ? `<table><thead><tr><th>Código</th><th>Hora</th><th></th></tr></thead><tbody>${S.prizesPending.map(p => `<tr><td>${esc(p.code)}</td><td>${hhmm(p.at)}</td><td><button class="key wide" data-dv="${esc(p.code)}" type="button">Entregue</button></td></tr>`).join('')}</tbody></table>` : '<p class="note" style="margin-top:12px">Nenhum prêmio pendente de entrega.</p>'}</section>
    ${CONFIG.prizeStockUsedOn === 'landing' ? `<section class="panel"><div class="tag">Prêmios reservados e não conquistados</div>
      <p class="story" style="margin:12px 0">${S.toReturn} ${S.toReturn === 1 ? 'desafio foi reprovado' : 'desafios foram reprovados'}: o prêmio reservado nesses giros não foi entregue e pode voltar ao estoque (as baixas diminuem).</p>
      <button class="btn secondary" id="ret" type="button" ${S.toReturn ? '' : 'disabled'}>Devolver ${S.toReturn} ao estoque</button></section>` : ''}
    <section class="panel"><div class="tag">Últimos registros</div>
      ${recent ? `<div class="table-wrap"><table><thead><tr><th>Hora</th><th>Tipo</th><th>Detalhe</th><th>Resultado</th></tr></thead><tbody>${recent}</tbody></table></div>` : '<p class="note" style="margin-top:12px">Ainda não há giros.</p>'}</section>
    <div class="btns cols"><button class="btn secondary" id="csv" type="button">Exportar histórico</button><button class="btn danger" id="zero" type="button">Zerar o jogo</button></div>
  </div>`;
  $('back').onclick = () => { location.hash = ''; };
  document.querySelectorAll('#org [data-set]').forEach(b => b.onclick = () => {
    const k = b.dataset.set, nome = k === 'souvenirs' ? 'Total de brindes' : 'Total de prêmios';
    askNumber(nome, db.total[k], n => { setTotal(k, n); renderOrg(); });
  });
  document.querySelectorAll('#org [data-s]').forEach(b => b.onclick = () => { setTotal(b.dataset.s, db.total[b.dataset.s] + +b.dataset.d); renderOrg(); });
  document.querySelectorAll('#org [data-dv]').forEach(b => b.onclick = () => { const l = db.log.find(x => x.code === b.dataset.dv); if (l) { l.delivered = true; save(); } renderOrg(); });
  if ($('ret')) $('ret').onclick = () => {
    const n = S.toReturn; db.log.filter(c => c.type === 'challenge' && c.result === 'fail' && !c.returned).forEach(c => { c.returned = true; });
    db.used.prizes = Math.max(0, db.used.prizes - n); save(); drawWheel(); renderOrg();
  };
  $('csv').onclick = () => download('roleta-historico.csv', [['data', 'hora', 'tipo', 'detalhe', 'resultado', 'codigo_premio', 'entregue'],
    ...db.log.map(l => { const d = describe(l); return [new Date(l.at).toLocaleDateString('pt-BR'), new Date(l.at).toLocaleTimeString('pt-BR'), d[0], d[1], d[2], d[3], d[4]]; })]);
  $('zero').onclick = () => { if (confirm('Zerar o jogo? Isso apaga as baixas de estoque, o total informado de brindes e de prêmios e o histórico. Exporte o histórico antes, se precisar.')) { resetGame(); renderOrg(); } };
}
/* rotas: vazio = roleta; #organizacao = página da organização (pede o PIN) */
function route() {
  const org = location.hash === '#organizacao';
  $('stage').hidden = org; $('org').hidden = !org;
  if (org) {
    clearTimeout(idleT); closeModal();
    if (ui.challenge) abandonChallenge();
    if (ui.quiz) abandonQuiz();
    if (orgOk) renderOrg();
    else { $('org').innerHTML = ''; askPin(() => { orgOk = true; renderOrg(); }, () => { location.hash = ''; }); }
  } else {
    orgOk = false;
    if (ui.mode !== 'spin') showAttract();
  }
}
addEventListener('hashchange', route);
let taps = [];
$('hot').addEventListener('pointerdown', () => {            // 3 toques no canto inferior esquerdo abrem a organização
  const now = Date.now(); taps = taps.filter(t => now - t < 1500); taps.push(now);
  if (taps.length >= 3) { taps = []; location.hash = 'organizacao'; }
});

/* ---------- modo teste ---------- */
function renderTestBar() {
  const bar = $('testbar'); bar.hidden = false;
  bar.innerHTML = `<span>Modo teste</span><button type="button" id="tbGold">${forceGold ? 'Próximo giro: Proteção Total (ativado)' : 'Forçar Proteção Total no próximo giro'}</button><button type="button" id="tbAdmin">Organização</button><button type="button" id="tbStock">Estoque 110/10</button><button type="button" id="tbZero">Zerar</button><button type="button" id="tbExit">Sair</button>`;
  $('tbGold').onclick = () => { forceGold = !forceGold; renderTestBar(); };
  $('tbAdmin').onclick = () => { location.hash = 'organizacao'; };
  $('tbStock').onclick = () => { resetGame(); db.total = { ...TEST_STOCK }; save(); drawWheel(); showAttract(); };
  $('tbZero').onclick = () => { if (confirm('Zerar os dados de teste?')) { resetGame(); showAttract(); } };
  $('tbExit').onclick = () => { location.href = location.pathname; };
}

/* ---------- fundo do quiz: colunas de código caindo ---------- */
(function initRain() {
  const snippets = [
    "if (link.suspicious) report();", "const mfa = true;", "hash(password, salt);", "while (alive) { scan(); }",
    "lgpd.consent(user);", "firewall.allow(trusted);", "token.rotate();", "if (!verified) deny();",
    "encrypt(data, key);", "audit.log(event);", "return 'threat_blocked';", "session.expire(15);",
    "patch(vuln.cve);", "const zeroTrust = 1;", "phishing.detect(mail);", "vpn.connect();",
  ];
  const rain = $('rain');
  for (let c = 0; c < 6; c++) {
    const col = document.createElement('div');
    col.className = 'rain';
    col.style.left = (c * 17 + Math.random() * 6) + '%';
    col.style.animationDuration = (45 + Math.random() * 40) + 's';
    col.style.animationDelay = (-Math.random() * 60) + 's';
    col.textContent = shuffle(snippets).concat(shuffle(snippets)).join('\n');
    rain.appendChild(col);
  }
})();

/* ---------- início ---------- */
if (TEST) renderTestBar();
drawWheel();
route();
</script>
