<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#002233">
<meta name="robots" content="noindex,nofollow">
<title>Cyber Shield Game · TOTVS</title>
<style>
  @font-face { font-family: 'TOTVS'; font-weight: 200; font-style: normal; font-display: swap; src: url('fonts/TOTVS-ExtraLight.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 300; font-style: normal; font-display: swap; src: url('fonts/TOTVS-Light.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/TOTVS-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 600; font-style: normal; font-display: swap; src: url('fonts/TOTVS-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 700; font-style: normal; font-display: swap; src: url('fonts/TOTVS-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'TOTVS'; font-weight: 800; font-style: normal; font-display: swap; src: url('fonts/TOTVS-ExtraBold.ttf') format('truetype'); }
  :root {
    --bg0: #002233;
    --bg1: #002233;
    --panel: rgba(0,34,51,.9);
    --panel-2: rgba(255,255,255,.07);
    /* paleta do jogo: apenas estas cores, mais branco */
    --purple: #A44DFF;
    --pink: #FF009E;
    --cyan: #00DBFF;
    --mint: #00FFD4;
    --lime: #D9FF65;
    --orange: #FF8900;
    --line: rgba(164,77,255,.45);
    --text: #FFFFFF;
    --muted: rgba(255,255,255,.72);
    --ok: #00FFD4;
    --bad: #FF009E;
    --warn: #FF8900;
    --grad: linear-gradient(90deg, #A44DFF, #FF009E);   /* único gradiente do jogo */
    --label: 'TOTVS', Verdana, sans-serif;   /* rótulos, botões e números */
    --sans: Verdana, sans-serif;
    --display: 'TOTVS', Verdana, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg0); }
  body {
    margin: 0; color: var(--text); font: 16px/1.5 var(--sans);
    min-height: 100vh; min-height: 100dvh; position: relative; overflow-x: hidden;
    background:
      radial-gradient(1100px 560px at 50% -12%, rgba(164,77,255,.42), transparent 62%),
      radial-gradient(700px 480px at 100% 100%, rgba(255,0,158,.16), transparent 60%),
      radial-gradient(600px 420px at 0% 70%, rgba(164,77,255,.12), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    background-attachment: fixed;
  }

  /* ---------- cenário ---------- */
  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floor {
    position: absolute; left: -50%; right: -50%; bottom: -2%; height: 46vh;
    background:
      repeating-linear-gradient(90deg, rgba(164,77,255,.35) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(0deg, rgba(164,77,255,.35) 0 1px, transparent 1px 48px);
    transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%);
            mask-image: linear-gradient(to top, #000 10%, transparent 92%);
    opacity: .42; animation: run 2.4s linear infinite;
  }
  @keyframes run { to { background-position: 0 0, 0 48px; } }
  .rain { position: absolute; top: 0; font: 11px/1.7 var(--sans); color: var(--purple); opacity: .06; white-space: pre; animation: fall linear infinite; }
  @keyframes fall { from { transform: translateY(-60%); } to { transform: translateY(100vh); } }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,34,51,.45)); }

  main { position: relative; z-index: 1; }
  @keyframes blink { 50% { opacity: .25; } }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 18px 8px; }
  #testbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; padding: 7px 12px;
    font: 700 .66rem/1.3 var(--label); letter-spacing: .08em; text-transform: uppercase; color: #002233; background: var(--warn); }
  #testbar[hidden] { display: none; }
  #testbar button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  body.test .wrap { padding-top: 56px; }
  .screen { animation: in .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- tipografia ---------- */
  h1, h2 { margin: 0; font-family: var(--display); line-height: 1.05; letter-spacing: -.02em; }
  .title { font-size: clamp(2.5rem, 13vw, 3.7rem); font-weight: 800; text-transform: uppercase; }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(164,77,255,.35)); }
  .tag { font: 700 .72rem/1 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }
  .tag::before { content: "// "; color: var(--muted); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .mono { font-family: var(--label); }
  .center { text-align: center; }

  /* ---------- painel HUD (cantos em L) ---------- */
  .panel {
    --c: var(--purple); --s: 16px; --t: 2px;
    position: relative; padding: 20px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 4px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--s) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) top left / var(--t) var(--s) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--s) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--t) var(--s) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--s) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--s) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--s) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--s) no-repeat,
      var(--panel);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 0 40px rgba(164,77,255,.07), inset 0 0 40px rgba(164,77,255,.04);
  }

  /* ---------- hero ---------- */
  .home { min-height: calc(100vh - 56px); min-height: calc(100dvh - 56px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 0 24px; }
  .headline { font-size: clamp(2.3rem, 11vw, 3.6rem); font-weight: 800; line-height: 1; letter-spacing: -.03em; text-transform: uppercase; margin: 14px 0 18px; }
  .provoke { max-width: 36ch; margin: 0 auto 30px; font: .88rem/1.55 var(--sans); color: var(--muted); }
  .caret::after { content: "_"; margin-left: 2px; color: var(--lime); animation: blink 1s steps(2) infinite; }
  .home-actions { width: 100%; max-width: 340px; }
  .shield { width: 120px; height: 120px; margin: 0 auto 18px; display: block; filter: drop-shadow(0 0 22px rgba(164,77,255,.45)); }
  .shield .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  .shield .spin.rev { animation-duration: 16s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chips { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .chip { font: 700 .7rem/1 var(--label); letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--cyan); }
  .chip b { color: var(--lime); }

  /* ---------- formulário ---------- */
  label { display: block; font: 700 .7rem/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 14px; font: 1rem var(--sans); color: var(--text); background: rgba(0,34,51,.55);
    border: 1px solid var(--line); border-radius: 2px; transition: border-color .2s, box-shadow .2s; }
  input::placeholder { color: rgba(255,255,255,.55); }
  input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(164,77,255,.18), 0 0 18px rgba(164,77,255,.2); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 18px 0 4px; font: 400 .85rem/1.45 var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--lime); flex: none; }
  .error { color: var(--bad); font: .85rem var(--sans); margin-top: 12px; min-height: 1.3em; }

  /* ---------- botões ---------- */
  /* botão ajustado ao texto; botões vizinhos ficam com a largura do maior (ver groupButtons) */
  .btn { display: inline-flex; align-items: center; justify-content: center; width: auto; min-width: 210px; margin-top: 12px; padding: 15px 34px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; white-space: nowrap;
    font: 800 .9rem/1 var(--label); letter-spacing: .2em; text-transform: uppercase; text-align: center; transition: transform .15s, box-shadow .2s, background .2s; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn.primary { color: #FFFFFF; background: var(--grad); box-shadow: 0 0 26px rgba(164,77,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.primary:hover:not(:disabled) { box-shadow: 0 0 38px rgba(255,0,158,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.secondary { color: #FFFFFF; background: rgba(0,34,51,.4); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--purple); box-shadow: 0 0 18px rgba(164,77,255,.35); }
  .btn.danger { color: var(--bad); background: transparent; border-color: rgba(255,0,158,.5); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btns { display: grid; grid-template-columns: max-content; justify-content: center; gap: 12px; margin: 14px auto 0; }
  .btns .btn { width: 100%; margin-top: 0; }
  #fb .btn { min-width: 340px; max-width: 100%; }   /* largura fixa: o texto da contagem muda e o botão não pode "pular" */
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  .homelink { display: inline-block; margin: 0 0 14px; padding: 6px 0; background: none; border: 0; cursor: pointer; font: 700 .74rem/1 var(--label); letter-spacing: .06em; color: var(--muted); transition: color .2s; }
  .homelink:hover { color: var(--cyan); }
  .linkish { background: none; border: 0; color: var(--muted); font: .72rem var(--label); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; padding: 10px; text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- partida ---------- */
  .hud { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 10px; }
  .hud .lvl { font: 800 1.5rem/1 var(--label); }
  .hud .lvl small { font-size: .8rem; color: var(--muted); }
  .hud .score { text-align: right; font: 700 .68rem/1 var(--label); letter-spacing: .16em; color: var(--muted); }
  .hud .score b { display: block; margin-top: 6px; font-size: 1.5rem; letter-spacing: 0; color: var(--lime); text-shadow: 0 0 14px rgba(217,255,101,.45); }
  .progress { display: flex; gap: 4px; margin-bottom: 14px; }
  .progress i { flex: 1; height: 4px; background: rgba(255,255,255,.2); }
  .progress i.done { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
  .progress i.cur { background: var(--lime); box-shadow: 0 0 10px var(--lime); animation: blink 1s steps(2) infinite; }
  .combo { display: inline-block; font: 800 .72rem/1 var(--label); letter-spacing: .16em; padding: 6px 9px; color: #002233; background: var(--lime); box-shadow: 0 0 16px rgba(217,255,101,.6); animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .timer { position: relative; width: 54px; height: 54px; color: var(--cyan); }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .timer circle { fill: none; stroke-width: 4; }
  .timer .bg { stroke: rgba(255,255,255,.22); }
  .timer .fg { stroke: currentColor; stroke-linecap: round; filter: drop-shadow(0 0 5px currentColor); transition: stroke-dashoffset .1s linear; }
  .timer span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 1rem var(--label); color: var(--text); }
  .timer.low { color: var(--warn); }
  .timer.crit { color: var(--bad); animation: shake .4s infinite; }
  @keyframes shake { 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }
  .q { font-family: var(--display); font-size: 1.25rem; font-weight: 700; line-height: 1.35; margin: 0 0 18px; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
    color: var(--text); font: inherit; background: rgba(0,34,51,.25); border: 1px solid var(--line); border-radius: 2px; transition: border-color .15s, background .15s, box-shadow .15s, transform .15s; }
  .opt .key { flex: none; width: 28px; height: 28px; display: grid; place-items: center; font: 800 .8rem var(--label); color: var(--cyan); border: 1px solid var(--line); background: rgba(164,77,255,.08); }
  .opt:hover:not(:disabled) { border-color: var(--purple); background: rgba(164,77,255,.09); box-shadow: 0 0 18px rgba(164,77,255,.18); transform: translateX(3px); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: rgba(0,255,212,.12); box-shadow: 0 0 20px rgba(0,255,212,.22); }
  .opt.correct .key { color: #002233; background: var(--ok); border-color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: rgba(255,0,158,.12); }
  .opt.wrong .key { color: #fff; background: var(--bad); border-color: var(--bad); }
  .opt.dim { opacity: .38; }
  .opt.sel { border-color: var(--lime); background: rgba(217,255,101,.1); box-shadow: 0 0 18px rgba(217,255,101,.2); }
  .opt.sel .key { color: #002233; background: var(--lime); border-color: var(--lime); }
  #confirm { margin-top: 6px; }
  .term .rule { margin: 4px 0 10px; padding: 10px 12px; font: 700 1rem/1.35 var(--display); color: var(--text); background: rgba(217,255,101,.09); border-left: 3px solid var(--lime); }
  .term .rule span { display: block; margin-bottom: 4px; font: 800 .62rem/1 var(--label); letter-spacing: .18em; text-transform: uppercase; color: var(--lime); }
  .readbar { height: 3px; margin: 12px 0 0; background: rgba(255,255,255,.2); }
  .readbar i { display: block; height: 100%; width: 0; background: var(--grad); box-shadow: 0 0 8px var(--purple); }
  ul.rules { margin: 12px 0 0; padding: 0; list-style: none; }
  ul.rules li { position: relative; padding: 8px 0 8px 18px; border-bottom: 1px solid rgba(164,77,255,.12); font: 700 .95rem/1.35 var(--display); }
  ul.rules li:last-child { border-bottom: 0; }
  ul.rules li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 7px; height: 7px; background: var(--lime); box-shadow: 0 0 8px var(--lime); transform: rotate(45deg); }
  .term { margin-top: 4px; padding: 14px 16px; font: .9rem/1.55 var(--sans); background: rgba(0,34,51,.55); border-left: 3px solid var(--muted); animation: in .3s both; }
  .term.ok { border-left-color: var(--ok); }
  .term.bad { border-left-color: var(--bad); }
  .term .h { font-family: var(--label); font-weight: 800; letter-spacing: .08em; margin-bottom: 6px; }
  .term.ok .h { color: var(--ok); }
  .term.bad .h { color: var(--bad); }
  .term .b { color: var(--muted); font-family: var(--sans); font-size: .92rem; }
  .term .b::before { content: "// "; color: var(--cyan); font-family: var(--label); }

  /* ---------- resultado ---------- */
  .stars { display: flex; gap: 6px; justify-content: center; margin: 10px 0 6px; }
  .stars { align-items: flex-end; }
  .stars svg { width: 66px; height: 66px; overflow: visible; }
  .stars svg:nth-child(3) { width: 92px; height: 92px; }
  .stars svg:first-child { width: 0; height: 0; }
  .stars .on { fill: url(#gStar); filter: drop-shadow(0 0 10px rgba(217,255,101,.7)); stroke: none; }
  .stars .off { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .rank-title { font: 800 1.05rem/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
  .score-big { font-family: var(--display); font-size: clamp(3.4rem, 18vw, 5rem); font-weight: 800; line-height: 1; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .stats div { padding: 12px 6px; border: 1px solid var(--line); background: var(--panel-2); text-align: center; }
  .stats b { display: block; font: 800 1.15rem var(--label); color: var(--text); }
  .stats span { font: .62rem var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* ---------- ranking ---------- */
  .rank { list-style: none; margin: 0; padding: 0; counter-reset: none; }
  .rank li { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 12px 10px; border-bottom: 1px solid rgba(164,77,255,.12); }
  .rank li:last-child { border-bottom: 0; }
  .rank li.me { background: rgba(217,255,101,.08); box-shadow: inset 3px 0 0 var(--lime); }
  .rank .pos { font: 800 1.05rem var(--label); text-align: center; color: var(--muted); }
  .rank .top1 .pos { color: #D9FF65; text-shadow: 0 0 12px rgba(217,255,101,.7); }
  .rank .top2 .pos { color: #FFFFFF; text-shadow: 0 0 12px rgba(255,255,255,.5); }
  .rank .top3 .pos { color: #FF8900; text-shadow: 0 0 12px rgba(255,137,0,.5); }
  .rank .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .who span { font: .75rem var(--sans); color: var(--muted); }
  .rank .pts { font: 800 1.1rem var(--label); color: var(--lime); }
  .empty { padding: 28px 0; text-align: center; font: .9rem var(--sans); color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font: .8rem var(--sans); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(164,77,255,.12); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  /* ---------- telão (#telao) ---------- */
  body.tv { --u: min(1vw, 1.75vh); overflow: hidden; }
  body.tv.idle { cursor: none; }
  body.tv .wrap { max-width: none; padding: calc(var(--u) * 1.6) calc(var(--u) * 4) calc(var(--u) * .4); }
  body.tv .tag { font-size: calc(var(--u) * 1); }
  body.tv .homelink { position: fixed; right: calc(var(--u) * 2); bottom: calc(var(--u) * 1.2); z-index: 5; margin: 0; font-size: calc(var(--u) * .9); transition: opacity .4s; }
  body.tv.idle .homelink, body.tv.idle #tvfs { opacity: 0; }
  .tv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: calc(var(--u) * 2); }
  .tv-title { font-size: calc(var(--u) * 5.2); margin-top: calc(var(--u) * .5); }
  .tv-meta { display: flex; align-items: center; gap: calc(var(--u) * 2); font: 700 calc(var(--u) * 1) var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: calc(var(--u) * .6); }
  .tv-meta b { color: var(--lime); }
  .tv-live { color: var(--lime); }
  .tv-live::before { content: ""; display: inline-block; width: .7em; height: .7em; margin-right: .6em; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); animation: blink 1.2s steps(2) infinite; }
  #tvfs { transition: opacity .4s; }
  .tv-pods { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: calc(var(--u) * 1.6); align-items: end; margin: calc(var(--u) * 1) 0 calc(var(--u) * 1); }
  .pod { margin: 0; padding: calc(var(--u) * 1.4) calc(var(--u) * 1.2); text-align: center; min-width: 0; --s: calc(var(--u) * 1.4); }
  .pod.p1 { --c: #D9FF65; order: 2; padding-top: calc(var(--u) * 2); padding-bottom: calc(var(--u) * 2); box-shadow: 0 0 60px rgba(217,255,101,.14), inset 0 0 40px rgba(217,255,101,.06); }
  .pod.p2 { --c: #FFFFFF; order: 1; }
  .pod.p3 { --c: #FF8900; order: 3; }
  .pod .medal { font: 800 calc(var(--u) * 1.5) var(--label); letter-spacing: .2em; color: var(--c); text-shadow: 0 0 14px var(--c); }
  .pod .pname { font: 700 calc(var(--u) * 2) / 1.15 var(--display); margin-top: calc(var(--u) * .5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod.p1 .pname { font-size: calc(var(--u) * 2.7); }
  .pod .pmail { font: calc(var(--u) * 1) var(--sans); color: var(--muted); margin-top: calc(var(--u) * .2); }
  .pod .ppts { font: 800 calc(var(--u) * 4.4) / 1 var(--display); margin-top: calc(var(--u) * .7); font-variant-numeric: tabular-nums; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(164,77,255,.35)); }
  .pod.p1 .ppts { font-size: calc(var(--u) * 6); }

<script>
/* ============================================================
   CONFIGURAÇÃO — ajuste aqui sem mexer no resto do código
   ============================================================ */
const CONFIG = {
  gameTitle: ['Cyber', 'Shield', 'Game'],
  allowedDomains: ['totvs.com.br'],   // [] para aceitar qualquer domínio
  questionsPerGame: 10,
  secondsPerQuestion: 20,
  levelPoints: [100, 150, 200],       // pontos por acerto: pergunta fácil, média, difícil
  speedBonusMax: 100,                 // bônus máximo por rapidez
  reviewFactor: 0.5,                  // acerto na rodada de revisão vale 50% dos pontos da pergunta
  readSecondsOk: 6,                  // pausa para ler a explicação após um acerto
  readSecondsWrong: 8,               // pausa para ler a explicação após um erro
  comboStep: 10,                      // bônus por acerto consecutivo (a partir do 2º)
  comboMax: 50,                       // teto do bônus de combo
  attemptsPerEmail: 3,                // melhor pontuação conta
  rankingSize: 10,
  adminPin: '2468',                   // PROTÓTIPO: trocar/remover quando houver backend
  storageKey: 'sp-game-v1',
};

/* MODO TESTE: abrir o jogo com ?teste no endereço (ex.: index.html?teste).
   Aceita qualquer e-mail, sem limite de tentativas, e usa um armazenamento
   separado, então nada do teste entra no ranking real. */
const TEST = /[?&]teste(=|&|$)/.test(location.search);
if (TEST) Object.assign(CONFIG, { allowedDomains: [], attemptsPerEmail: Infinity, storageKey: 'sp-game-v1-teste' });
const attemptsLabel = n => n === Infinity ? '∞' : n;

/* ============================================================
   CAMADA DE ARMAZENAMENTO
   Hoje: localStorage (cada aparelho tem seu próprio ranking).
   Para ligar ao backend/TI: reimplementar estes métodos
   (todos assíncronos) sem alterar o resto do jogo.
   ============================================================ */
const Store = {
  _read() {
    try {
      const d = JSON.parse(localStorage.getItem(CONFIG.storageKey)) || {};
      return { results: d.results || [], seen: d.seen || {} };
    } catch { return { results: [], seen: {} }; }
  },
  _write(data) { localStorage.setItem(CONFIG.storageKey, JSON.stringify(data)); },
  async countAttempts(email) {
    return this._read().results.filter(r => r.email === email).length;
  },
  async saveResult(result) {
    const data = this._read();
    data.results.push(result);
    this._write(data);
  },
  async getAllResults() { return this._read().results; },
  async getSeen(email) { return this._read().seen[email] || []; },
  async addSeen(email, ids) {
    const data = this._read();
    data.seen[email] = [...new Set([...(data.seen[email] || []), ...ids])];
    this._write(data);
  },
  async clearAll() { this._write({ results: [], seen: {} }); },
};

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const normEmail = e => e.trim().toLowerCase();
const maskEmail = e => { const [u, d] = e.split('@'); return (u[0] || '') + '***@' + d; };
const fmtTime = ms => (ms / 1000).toFixed(1).replace('.', ',') + 's';
const pad2 = n => String(n).padStart(2, '0');
const csvCell = v => { let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function validateEmail(email) {
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Informe um e-mail válido.';
  const domain = email.split('@')[1];
  const ds = CONFIG.allowedDomains;
  if (ds.length && !ds.some(d => domain === d || domain.endsWith('.' + d)))
    return 'Use seu e-mail corporativo (@' + ds[0] + ').';
  return '';
}

/** Soma das partidas de cada e-mail, ordenada: pontos > acertos > menor tempo > terminou antes. */
function buildRanking(results) {
  const by = new Map();
  for (const r of results) {
    const a = by.get(r.email);
    if (!a) { by.set(r.email, { ...r, games: 1 }); continue; }
    if (r.at > a.at) a.name = r.name;
    a.score += r.score; a.correct += r.correct; a.total += r.total; a.timeMs += r.timeMs;
    a.at = Math.max(a.at, r.at); a.games++;
  }
  return [...by.values()].sort(cmp);
}
function cmp(a, b) {
  return b.score - a.score || b.correct - a.correct || a.timeMs - b.timeMs || a.at - b.at;
}

function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
/** Agrupa botões vizinhos para que todos fiquem com a largura do maior, sem depender de alinhamento. */
function groupButtons(root) {
  root.querySelectorAll('.btn').forEach(b => {
    if (b.parentElement.classList.contains('btns')) return;
    const run = [b];
    for (let n = b.nextElementSibling; n && n.classList.contains('btn'); n = n.nextElementSibling) run.push(n);
    const wrap = document.createElement('div');
    wrap.className = 'btns';
    b.parentElement.insertBefore(wrap, b);
    run.forEach(x => wrap.appendChild(x));
  });
}
function render(html, kind = 'page') {
  stopTimer();
  if (keyHandler) { document.removeEventListener('keydown', keyHandler); keyHandler = null; }
  const back = kind === 'home' ? '' : '<button class="homelink" type="button">&larr; Voltar ao Início</button>';
  $app.innerHTML = `<div class="screen">${back}${html}</div>`;
  groupButtons($app);
  const link = $app.querySelector('.homelink');
  if (link) link.onclick = () => {
    if (kind === 'game' && !confirm('Sair da partida? O progresso desta tentativa será perdido.')) return;
    if (location.hash === '' || location.hash === '#') screenHome(); else go('');
  };
  window.scrollTo(0, 0);
}
function countUp(el, to, ms = 1000) {
  if (reduceMotion || to === 0) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    const name = document.getElementById('name').value.trim().replace(/\s+/g, ' ');
    const email = normEmail(document.getElementById('email').value);
    const consent = document.getElementById('consent').checked;
    const err = document.getElementById('err');
    if (name.length < 2) return err.textContent = '> erro: informe seu nome.';
    const emailErr = validateEmail(email);
    if (emailErr) return err.textContent = '> erro: ' + emailErr.toLowerCase();
    if (!consent) return err.textContent = '> erro: é necessário concordar para participar.';
    const used = await Store.countAttempts(email);
    if (used >= CONFIG.attemptsPerEmail)
      return err.textContent = `> acesso negado: você já usou suas ${CONFIG.attemptsPerEmail} tentativas. Confira sua posição no ranking!`;
    player = { name, email };
    // Compartilha a identidade da sessão com a roleta na mesma origem.
    localStorage.setItem('sp-current-player', JSON.stringify({ name, email, at: Date.now() }));
    startGame();
  };
}

const qid = q => { let h = 5381; for (const c of q.q) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };

/** Sorteia a partida: metade de segurança e metade de privacidade, dando prioridade às que o jogador ainda não viu. */
function pickQuestions(seenIds) {
  const seen = new Set(seenIds);
  const half = Math.ceil(CONFIG.questionsPerGame / 2);
  const take = (t, n) => {
    const pool = QUESTIONS.filter(q => q.t === t);
    return shuffle(pool.filter(q => !seen.has(qid(q)))).concat(shuffle(pool.filter(q => seen.has(qid(q))))).slice(0, n);
  };
  return shuffle([...take('s', half), ...take('p', CONFIG.questionsPerGame - half)]);
}

async function startGame() {
  const picked = pickQuestions(await Store.getSeen(player.email));
  await Store.addSeen(player.email, picked.map(qid));
  game = {
    qs: picked.map(q => {
      const opts = shuffle([{ text: q.correct, ok: true }, ...q.wrong.map(text => ({ text, ok: false }))]);
      return { q: q.q, why: q.why, rule: q.rule, d: q.d || 2, opts };
    }),
    mode: 'main',          // 'main' = 10 perguntas; 'review' = rodada de revisão dos erros
    rev: [], missed: [], revRight: 0,
    i: 0, score: 0, correct: 0, timeMs: 0, streak: 0,
  };
  screenQuestion();
}

const RING_C = 2 * Math.PI * 27;

/** Rodada de revisão: as perguntas erradas voltam, com alternativas embaralhadas. */
function screenReviewIntro() {
  game.mode = 'review'; game.i = 0;
  game.rev = game.missed.map(k => ({ ...game.qs[k], opts: shuffle(game.qs[k].opts) }));
  const n = game.rev.length;
  render(`
    <div class="tag">Rodada de revisão</div>
    <h1 class="title" style="font-size:2.2rem;margin:8px 0 14px"><span class="grad">Hora de revisar</span></h1>
    <section class="panel">
      <p style="margin-top:0">Você errou <b>${n}</b> ${n === 1 ? 'pergunta' : 'perguntas'}. ${n === 1 ? 'Ela volta' : 'Elas voltam'} agora, com as alternativas em outra ordem.</p>
      <p class="muted" style="margin-bottom:0">Cada acerto vale <b>${Math.round(CONFIG.reviewFactor * 100)}%</b> dos pontos da pergunta. Não há bônus de rapidez: use o que acabou de ler.</p>
    </section>
    <button class="btn primary" id="go" type="button">Começar revisão</button>
  `, 'game');
  document.getElementById('go').onclick = screenQuestion;
}

function screenQuestion() {
  const review = game.mode === 'review';
  const list = review ? game.rev : game.qs;
  const total = list.length, q = list[game.i];
  const limit = CONFIG.secondsPerQuestion * 1000;
  render(`
    <div class="hud">
      <div class="lvl"><small>${review ? 'REVISÃO' : 'FASE'}</small> ${pad2(game.i + 1)}<small>/${pad2(total)}</small></div>
      <div id="combo">${!review && game.streak >= 2 ? `<span class="combo">COMBO x${game.streak}</span>` : ''}</div>
      <div class="score">SCORE<b id="score">${game.score}</b></div>
    </div>
    <div class="progress" aria-hidden="true">${list.map((_, k) => `<i class="${k < game.i ? 'done' : k === game.i ? 'cur' : ''}"></i>`).join('')}</div>
    <section class="panel">
      <div class="q-head">
        <span class="tag">${review ? 'Revisão' : 'Ameaça detectada'}</span>
        <div class="timer" id="timer" role="timer" aria-label="Tempo restante">
          <svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="ring" cx="32" cy="32" r="27" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg>
          <span id="secs">${CONFIG.secondsPerQuestion}</span>
        </div>
      </div>
      <p class="q">${esc(q.q)}</p>
      <div id="opts">${q.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}" aria-pressed="false"><span class="key">${'ABCD'[k]}</span><span>${esc(o.text)}</span></button>`).join('')}</div>
      <button class="btn primary" id="confirm" type="button" disabled>Confirmar resposta</button>
    </section>
    <div id="fb"></div>
  `, 'game');
  const start = performance.now();
  const box = document.getElementById('timer'), ring = document.getElementById('ring'), secs = document.getElementById('secs');
  let answered = false, sel = null;

  /** Confirmar (ou o tempo acabar) para o relógio; a leitura da explicação não é cronometrada. */
  const finish = chosen => {
    if (answered) return;
    answered = true; stopTimer();
    const elapsed = Math.min(performance.now() - start, limit);
    const right = chosen !== null && q.opts[chosen].ok;
    const base = CONFIG.levelPoints[q.d - 1];
    let gained = 0;
    if (review) {
      if (right) { gained = Math.round(base * CONFIG.reviewFactor); game.revRight++; }
    } else if (right) {
      game.streak++; game.correct++;
      const combo = Math.min(Math.max(game.streak - 1, 0) * CONFIG.comboStep, CONFIG.comboMax);
      gained = base + Math.round(CONFIG.speedBonusMax * (1 - elapsed / limit)) + combo;
    } else { game.streak = 0; game.missed.push(game.i); }
    if (!review) game.timeMs += elapsed;
    game.score += gained;
    document.getElementById('score').textContent = game.score;
    document.getElementById('combo').innerHTML = !review && game.streak >= 2 ? `<span class="combo">COMBO x${game.streak}</span>` : '';
    const confirmBtn0 = document.getElementById('confirm'), confirmBox = confirmBtn0.parentElement;
    confirmBtn0.remove();
    if (confirmBox.classList.contains('btns') && !confirmBox.children.length) confirmBox.remove();
    document.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true; b.classList.remove('sel');
      if (q.opts[k].ok) b.classList.add('correct');
      else if (k === chosen) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    const last = game.i === list.length - 1;
    const nextLabel = !last ? (review ? 'Próxima revisão' : 'Próxima fase')
      : !review && game.missed.length ? 'Começar revisão' : 'Ver resultado';
    const head = right ? (review ? `> REVISÃO CONCLUÍDA &nbsp;+${gained}` : `> ACCESS GRANTED &nbsp;+${gained}`)
      : chosen === null ? '> TIMEOUT: ameaça não neutralizada' : '> THREAT DETECTED: resposta incorreta';
    document.getElementById('fb').innerHTML = `
      <div class="term ${right ? 'ok' : 'bad'}">
        <div class="h">${head}</div>
        <div class="rule"><span>Regra de ouro</span>${esc(q.rule)}</div>
        <div class="b">${esc(q.why)}</div>
      </div>
      <div class="readbar" aria-hidden="true"><i id="readfill"></i></div>
      <button class="btn primary" id="next" type="button" disabled></button>`;
    groupButtons(document.getElementById('fb'));
    const next = document.getElementById('next'), fill = document.getElementById('readfill');
    const wait = (right ? CONFIG.readSecondsOk : CONFIG.readSecondsWrong) * 1000, t0 = performance.now();
    const tick = () => {
      const left = Math.max(0, wait - (performance.now() - t0));
      fill.style.width = (100 * (1 - left / wait)) + '%';
      if (left > 0) { next.textContent = `Leia a regra de ouro… ${Math.ceil(left / 1000)}s`; return; }
      stopTimer();
      next.disabled = false; next.textContent = nextLabel;
      next.focus({ preventScroll: true });
    };
    tick(); timer = setInterval(tick, 100);
    next.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
    next.onclick = () => {
      if (!last) { game.i++; screenQuestion(); }
      else if (!review && game.missed.length) screenReviewIntro();
      else finishGame();
    };
  };

  const confirmBtn = document.getElementById('confirm');
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (answered) return;
    sel = +b.dataset.k;
    document.querySelectorAll('.opt').forEach((x, k) => { x.classList.toggle('sel', k === sel); x.setAttribute('aria-pressed', k === sel); });
    confirmBtn.disabled = false;
    confirmBtn.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  });
  confirmBtn.onclick = () => { if (sel !== null) finish(sel); };

  timer = setInterval(() => {
    const left = Math.max(0, limit - (performance.now() - start));
    ring.style.strokeDashoffset = RING_C * (1 - left / limit);
    secs.textContent = Math.ceil(left / 1000);
    box.classList.toggle('low', left < limit * .5 && left >= limit * .25);
    box.classList.toggle('crit', left < limit * .25);
    if (left <= 0) finish(null);
  }, 100);
}

async function finishGame() {
  const result = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: player.name, email: player.email,
    score: game.score, correct: game.correct, total: game.qs.length,
    reviewCorrect: game.revRight, reviewTotal: game.rev.length,
    timeMs: Math.round(game.timeMs), at: Date.now(),
  };
  await Store.saveResult(result);
  const ranking = buildRanking(await Store.getAllResults());
  const pos = ranking.findIndex(r => r.email === player.email) + 1;
  const mine = ranking[pos - 1];
  const used = await Store.countAttempts(player.email);
  const left = CONFIG.attemptsPerEmail - used;
  const t = rankTitle(result.correct, result.total);
  const hasReview = result.reviewTotal > 0;
  const missedRules = game.missed.map(k => game.qs[k].rule);
  render(`
    <section class="panel center">
      <div class="tag">Missão concluída</div>
      ${starsSvg(t.stars)}
      <div class="rank-title">${esc(t.name)}</div>
      <div class="score-big grad" id="big">0</div>
      <div class="muted mono small">PONTOS · ${esc(player.name)}</div>
      ${mine.games > 1 ? `<div class="muted mono small" style="margin-top:4px">TOTAL NO RANKING · <b style="color:var(--lime)">${mine.score}</b> (${mine.games} partidas)</div>` : ''}
      <div class="stats" style="grid-template-columns:repeat(${hasReview ? 4 : 3},1fr)">
        <div><b>${result.correct}/${result.total}</b><span>acertos</span></div>
        ${hasReview ? `<div><b>${result.reviewCorrect}/${result.reviewTotal}</b><span>revisão</span></div>` : ''}
        <div><b>${fmtTime(result.timeMs)}</b><span>tempo</span></div>
        <div><b>${pos}º</b><span>ranking</span></div>
      </div>
    </section>
    <p class="center muted">${t.msg}${mine.games > 1 ? ' Seus pontos se somam aos das partidas anteriores.' : ''}</p>
    ${missedRules.length ? `
    <section class="panel">
      <div class="tag">Regras de ouro para levar</div>
      <ul class="rules">${missedRules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    </section>` : ''}
    <button class="btn primary" id="rank" type="button">Ver ranking</button>
    ${left > 0 ? `<button class="btn secondary" id="again" type="button">Jogar de novo (${attemptsLabel(left)})</button>` : '<p class="center muted small mono" style="margin-top:16px">&gt; todas as tentativas utilizadas</p>'}
  `);
  countUp(document.getElementById('big'), result.score);
  document.getElementById('rank').onclick = () => go('ranking');
  const again = document.getElementById('again');
  if (again) again.onclick = startGame;
}

async function screenRanking(meEmail) {
  const ranking = buildRanking(await Store.getAllResults());
  const top = ranking.slice(0, CONFIG.rankingSize);
  const me = meEmail ? ranking.findIndex(r => r.email === meEmail) : -1;
  const row = (r, i, isMe) => `
    <li class="${isMe ? 'me ' : ''}${i < 3 ? 'top' + (i + 1) : ''}">
      <span class="pos">${pad2(i + 1)}</span>
      <span class="who"><b>${esc(r.name)}</b><span>${esc(maskEmail(r.email))}</span></span>
      <span class="pts">${r.score}</span>
    </li>`;
  render(`
    <div class="tag">Leaderboard</div>
    <h1 class="title" style="font-size:2.4rem;margin:8px 0 6px"><span class="grad">Ranking</span></h1>
    <p class="muted small">Top ${CONFIG.rankingSize}. Os pontos de todas as suas partidas se somam. Em caso de empate vence quem acertou mais e respondeu mais rápido.</p>
    <section class="panel" style="padding:8px 10px">
      ${top.length ? `<ol class="rank">${top.map((r, i) => row(r, i, i === me)).join('')}</ol>` : '<p class="empty">&gt; nenhum jogador ainda. Seja o primeiro!</p>'}
    </section>
    ${me >= CONFIG.rankingSize ? `<section class="panel" style="padding:8px 10px"><ol class="rank">${row(ranking[me], me, true)}</ol></section>` : ''}
    <button class="btn primary" id="play" type="button">Jogar</button>
    <div class="center"><button class="linkish" id="admin" type="button">Organização</button></div>
  `);
  document.getElementById('play').onclick = () => go('jogar');
  document.getElementById('admin').onclick = () => go('organizacao');
}

/* ---------- Área da organização (PROTÓTIPO: PIN no cliente não é segurança real) ---------- */
function screenAdminLogin() {
  if (TEST) return screenAdmin();
  render(`
    <div class="tag">Acesso restrito</div>

async function screenAdmin() {
  const all = await Store.getAllResults();
  const ranking = buildRanking(all);
  render(`
    <div class="tag">Acesso restrito</div>
    <h1 class="title" style="font-size:2.2rem;margin:8px 0 6px"><span class="grad">Organização</span></h1>
    <p class="muted small mono">${all.length} partidas · ${ranking.length} participantes únicos (neste aparelho)</p>
    <section class="panel"><div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Nome</th><th>E-mail</th><th>Pts</th><th>Acertos</th><th>Partidas</th><th>Tempo</th></tr></thead>
      <tbody>${ranking.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${r.score}</td><td>${r.correct}/${r.total}</td><td>${r.games}</td><td>${fmtTime(r.timeMs)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Sem dados.</td></tr>'}</tbody>
    </table></div></section>
    <button class="btn primary" id="csv" type="button" ${all.length ? '' : 'disabled'}>Exportar CSV (ranking)</button>
    <button class="btn secondary" id="tv" type="button">Abrir ranking no telão</button>
    <button class="btn danger" id="clear" type="button">Apagar todos os dados</button>
    <button class="btn secondary" id="back" type="button">Voltar</button>`);
  document.getElementById('back').onclick = () => go('ranking');
  document.getElementById('tv').onclick = () => go('telao');
  document.getElementById('csv').onclick = () => {
    const head = ['posicao', 'nome', 'email', 'pontos', 'acertos', 'total', 'partidas', 'tempo_ms', 'data'];
    const lines = ranking.map((r, i) => [i + 1, r.name, r.email, r.score, r.correct, r.total, r.games, r.timeMs, new Date(r.at).toISOString()].map(csvCell).join(','));
    const blob = new Blob(['﻿' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ranking-seguranca-privacidade.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById('clear').onclick = async () => {
    if (confirm('Apagar TODOS os resultados deste aparelho? Esta ação não pode ser desfeita.')) { await Store.clearAll(); screenAdmin(); }
  };
}

/* ---------- Telão: ranking em tela cheia, atualiza sozinho (abrir em #telao) ---------- */
let tvStop = null;
function stopTv() {
  if (tvStop) { tvStop(); tvStop = null; }
  document.body.classList.remove('tv', 'idle');
}
function screenTv() {
  document.body.classList.add('tv');
  const podSlot = (r, i, fresh) => r ? `
    <section class="panel pod p${i + 1}${fresh ? ' fresh' : ''}">
      <div class="medal">${pad2(i + 1)}</div>
      <div class="pname">${esc(r.name)}</div>
      <div class="pmail">${esc(maskEmail(r.email))}</div>
      <div class="ppts">${r.score}</div>
      <div class="pmeta">${r.correct}/${r.total} acertos &middot; ${fmtTime(r.timeMs)}</div>
    </section>` : `
    <section class="panel pod p${i + 1} vazio"><div class="medal">${pad2(i + 1)}</div><div class="pname">aguardando&hellip;</div></section>`;
  const rowItem = (r, i, fresh) => `
    <li class="${fresh ? 'fresh' : ''}">
      <span class="pos">${pad2(i + 1)}</span>
      <span class="who"><b>${esc(r.name)}</b><span>${esc(maskEmail(r.email))}</span></span>
      <span class="pts">${r.score}</span>
    </li>`;
  render(`
    <div class="tv-head">
      <div>
        <div class="tag">Leaderboard ao vivo</div>
        <h1 class="title tv-title"><span class="grad">Ranking</span></h1>
      </div>
      <div class="tv-meta">
        <span class="tv-live">ao vivo</span>
        <span id="tvcount"></span>
        <button class="linkish" id="tvfs" type="button">Tela cheia (F)</button>
      </div>
    </div>
    <div id="tvlist"></div>
    <div class="tv-foot">
      <span>&gt; jogue agora: <b>${esc(location.host + location.pathname.replace(/index\.html$/, ''))}</b></span>
      <span>Soma das partidas &middot; desempate: mais acertos, depois menor tempo.</span>
    </div>
  `);

  const list = document.getElementById('tvlist');
  const count = document.getElementById('tvcount');
  let sig = '', prev = null, busy = false;
  const refresh = async () => {
    if (busy) return;
    busy = true;
    try {
      const all = await Store.getAllResults();
      const ranking = buildRanking(all);
      const top = ranking.slice(0, CONFIG.rankingSize);
      count.innerHTML = `<b>${ranking.length}</b> jogadores &middot; <b>${all.length}</b> partidas`;
      const next = JSON.stringify(top.map(r => [r.email, r.score]));
      if (next === sig) return;
      const was = prev;
      prev = new Map(top.map(r => [r.email, r.score]));
      sig = next;
      const isNew = r => !!was && was.get(r.email) !== r.score;
      if (!top.length) { list.innerHTML = '<p class="tv-empty">&gt; nenhum jogador ainda. Seja o primeiro!</p>'; return; }
      const rest = top.slice(3);
      list.innerHTML = `
        <div class="tv-pods">${[0, 1, 2].map(i => podSlot(top[i], i, top[i] && isNew(top[i]))).join('')}</div>
        ${rest.length ? `<ol class="tv-rows" style="grid-template-rows:repeat(${Math.ceil(rest.length / 2)},auto)">${rest.map((r, i) => rowItem(r, i + 3, isNew(r))).join('')}</ol>` : ''}`;
    } finally { busy = false; }
  };

  const fsBtn = document.getElementById('tvfs');
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch { /* navegador sem suporte a tela cheia */ }
  };
  fsBtn.onclick = toggleFs;
  keyHandler = ev => { if (ev.key === 'f' || ev.key === 'F') toggleFs(); };
  document.addEventListener('keydown', keyHandler);

  let idleT;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => document.body.classList.add('idle'), 3000);
  };
  addEventListener('mousemove', wake);
  wake();

  refresh();
  const poll = setInterval(refresh, 3000);
  addEventListener('storage', refresh);
  tvStop = () => {
    clearInterval(poll); clearTimeout(idleT);
    removeEventListener('mousemove', wake);
    removeEventListener('storage', refresh);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  };
}

function route() {
  stopTv();
  const h = location.hash.replace('#', '');
  if (h === 'telao') screenTv();
  else if (h === 'ranking') screenRanking(player && player.email);
  else if (h === 'jogar') screenRegister(player || {});
  else if (h === 'organizacao') screenAdminLogin();
  else screenHome();
}
addEventListener('hashchange', route);

initScene();
route();
